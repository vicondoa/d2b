[workspace.package]
license = "Apache-2.0"

# Keep ordinary development/test builds useful for panic backtraces without
# paying to generate and link full DWARF for the entire dependency graph.
# `debugging` is the explicit full-debug escape hatch for debugger sessions.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = 2

[profile.debugging.package."*"]
debug = 2

[workspace.lints.clippy]
# `priority = -1` keeps the group below the individual lints declared below it;
# clippy's `lint_groups_priority` (deny by default) fails the build otherwise.
all = { level = "warn", priority = -1 }
# U33: the mechanical half of the async-purity rule. `clippy.toml` at the
# workspace root holds the deny list of blocking APIs - mutex and read-write
# lock acquisition, condition-variable waits, blocking channel receives,
# thread sleep, blocking filesystem and subprocess calls, and blocking socket
# connect/accept/read/write including the nix socket entry points this tree
# uses - each entry naming a reason and a replacement that already exists in
# this workspace. The lint levels live here.
#
# `await_holding_refcell_ref` and `await_holding_lock` are live denials, not
# temporary. No interior-mutability borrow is held across a suspension point
# anywhere in the workspace today, and the three lock-across-await sites the
# census found are fixed: `d2bd/src/resource_runtime.rs`'s shutdown takes the
# registrar out of its shared slot before the per-session revoke awaits, and
# `d2b-bus/src/session_seam_tests.rs:1613` and `:1628` scope their guards so no
# `std::sync` guard is in scope at a suspension point. The lint is only the
# mechanical half of the rule, though: a synchronous lock acquired lexically
# inside an `async fn` still parks the executor worker while another thread
# holds it, and `await_holding_lock` cannot see that because no guard crosses
# the suspension point. Catching it needs a source-level policy check (a
# lexical scan for `std::sync` lock acquisition inside `async fn` bodies that
# fails closed); it is not landed here.
await_holding_refcell_ref = "deny"
await_holding_lock = "deny"
# TEMPORARY (U33 backlog). `disallowed_methods` stays allowed at the workspace
# level, not because the rule is optional but because the async-purity
# conversions are still landing. The census at 040896e9f, counted per call
# site across every target and deduplicated across the lib/test duplication
# that `--all-targets` produces (4948 distinct sites: 2196 production, 2752
# test), found 4945 `disallowed_methods` sites, led by `std::sync::Mutex::lock`
# (1594) and the filesystem calls; the broker (1227), the daemon (860), the
# daemon runtime (470) and xtask (458) carry the most. Denying it at the table
# now would fail `make check-clippy` on that whole backlog, so the level stays
# `allow` and the gate is built to fail only for the denied lints above - never
# for this backlog, and never for the pre-existing `clippy::all` warning
# corpus (833 diagnostics at the same commit) that `.cargo/config.toml`'s
# `-D warnings` would otherwise promote. The census command below is how the
# backlog stays visible meanwhile.
#
# The six members that do not inherit this table (`d2b-audit`, `d2b-broker`,
# `d2b-host-activation-helper`, `d2b-resource-compiler`, `d2b-sk-frontend`,
# `d2b-telemetry`) carry the same levels locally, because `clippy.toml` alone
# arms the lint at its default warn level in every crate clippy checks - the
# workspace table is not what turns it on.
#
# Removal condition: flip the line below to `deny` once the census is free of
# production hits, or every remaining hit carries an inline
# `#[allow(..., reason = "...")]` recorded on the crate policy check's tracked
# exception list. Re-run the census with:
#   cargo clippy --workspace --all-targets --message-format=json -- \
#     -W warnings -W clippy::disallowed_methods -W clippy::await_holding_lock \
#     -W clippy::await_holding_refcell_ref
# `-W warnings` neutralises the config's `-D warnings` so an unrelated
# pre-existing warning cannot abort a crate's lint pass and hide its hits.
disallowed_methods = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"
# `test_root` is an opt-in cfg flag used by a small set of
# d2bd integration tests that require running as uid 0 (or
# with delegated CAP_CHOWN) to exercise broker-owner production
# policy. Set via `RUSTFLAGS="--cfg test_root" cargo test
# --features=...` when executing as root. Declaring the
# check-cfg entry here silences the `unexpected_cfgs` warning
# the v1.1.1 reviewer flagged without weakening the
# safety guard for production callers.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(test_root)",
    "cfg(d2b_capability_trait_mutation, values(\"authenticated-component-session-clone\", \"authenticated-component-session-default\", \"component-session-admission-clone\", \"component-session-admission-default\", \"component-session-admission-from-unit\", \"session-acceptor-clone\", \"session-acceptor-default\", \"verified-unix-peer-clone\", \"verified-unix-peer-default\", \"verified-unix-peer-from-unit\"))",
] }

[workspace.dependencies]
base64 = "0.22"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["derive"] }
# W3 host-prepare low-level dependencies. `rustix` lands in the
# integrator prep so d2b-host stubs can compile and so the supply-
# chain gate (cargo-deny + cargo-audit through flake.nix's pinned
# advisory DB) covers it before scope agents consume it.
#
# `rtnetlink` and `nftnl` are intentionally NOT declared here: review
# for the W3 prep commit ruled they ship with the scope commit
# that first consumes them (s2 for rtnetlink, s3 for nftables) so the
# license / advisory whitelist update lands in the same commit that
# adds the consumer. See plan.md §"W3 broker variant additions" - the
# wire contract for routes/nft is fully encoded in d2b-contracts here,
# so scope agents have everything they need to pull these crates in.
rustix = { version = "0.38", features = ["fs", "process", "net", "pipe", "system", "mount", "thread", "pty", "termios", "stdio"] }
# W3 s3: sha2 lands here so d2b-host's nft drift-detection digest
# is byte-stable across builds and consumers. The nftnl native binding
# is intentionally NOT pulled in - see
# `docs/adr/0013-w3-firewall-coexistence-policy.md` for the reviewed
# fallback (typed NftBatch + `nft -f -` text rendering,
# verified by the broker's hash readback).
sha2 = "0.10"
unicode-normalization = "0.1"
tokio = { version = "1", default-features = false }
ttrpc = { version = "0.9.0", default-features = false }
# v3 resource-runtime rewrite (U1): ractor is the actor runtime for the new
# resource plane (one authoritative actor per desired resource, supervised
# respawns, requeue timers). Default features only - the cluster feature is
# deliberately excluded (Ractor remoting is out of scope per plan R22).
# First consumed by packages/d2b-resource-runtime (scaffold commit).
ractor = "0.16"
# v3 resource-runtime rewrite (U1): rusqlite backs the minimal durable
# desired-spec store (WAL, single-writer connection owned by the spec store
# task; all calls via spawn_blocking per KTD12). `bundled` compiles the pinned
# SQLite C sources so no system libsqlite3 is required.
# First consumed by packages/d2b-resource-runtime (scaffold commit).
rusqlite = { version = "0.40", features = ["bundled"] }
# v3 resource-runtime rewrite (U2): embedded schema migrations for the SQLite
# spec store (persist-then-reopen must apply migrations idempotently without a
# runtime-side migration runner). Small, auditable migration list only.
# First consumed by packages/d2b-resource-runtime (this commit).
rusqlite_migration = "2.6"
