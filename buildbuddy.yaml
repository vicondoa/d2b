actions:
  - name: "build / check"
    container_image: "ubuntu-22.04"
    triggers:
      pull_request:
        branches:
          - v3
        merge_with_base: true
      push:
        branches:
          - v3
    steps:
      - run: >-
          bazel test --config=local --build_tests_only --test_output=errors
          --test_tag_filters=-local,-no-remote-exec,-manual,-exclusive,-gpu,-kvm
          //bazel/checks:check
