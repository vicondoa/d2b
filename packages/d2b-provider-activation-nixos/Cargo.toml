[package]
name = "d2b-provider-activation-nixos"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

# test_support is needed both by external crates (which opt in via the
# `test-support` feature) and by this crate's OWN tests. Gating on
# `any(test, feature = "test-support")` makes the module available
# automatically when compiling this crate's tests, so `cargo test -p
# d2b-provider-activation-nixos` works without anyone having to remember
# `--features test-support`.
[features]
test-support = []

[dependencies]
tokio = { workspace = true, features = ["sync"] }
async-trait = "0.1"
tracing = "0.1"
parking_lot = "0.12"
d2b-contracts-broker = { path = "../d2b-contracts-broker", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-provider-toolkit = { path = "../d2b-provider-toolkit", version = "0.0.0-bootstrap" }
d2b-resource-runtime = { path = "../d2b-resource-runtime", version = "0.0.0-bootstrap" }
d2b-resource-types = { path = "../d2b-resource-types", version = "0.0.0-bootstrap" }
serde_json = { workspace = true }
sha2 = { workspace = true }
ring = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[[test]]
name = "registration"
path = "tests/registration.rs"
required-features = ["test-support"]
