[package]
name = "d2b-provider-volume"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[features]
test-support = []

[dependencies]
async-trait = "0.1"
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-provider-toolkit = { path = "../d2b-provider-toolkit", version = "0.0.0-bootstrap" }
d2b-provider-volume-local = { path = "../d2b-provider-volume-local", version = "0.0.0-bootstrap" }
d2b-provider-volume-virtiofs = { path = "../d2b-provider-volume-virtiofs", version = "0.0.0-bootstrap" }
d2b-resource-runtime = { path = "../d2b-resource-runtime", version = "0.0.0-bootstrap" }
d2b-resource-types = { path = "../d2b-resource-types", version = "0.0.0-bootstrap" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "registration"
path = "tests/registration.rs"
required-features = ["test-support"]
