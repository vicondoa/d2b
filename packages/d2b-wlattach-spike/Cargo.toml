# Standalone spike crate: intentionally NOT a member of packages/Cargo.toml.
# Precedent: packages/d2b-wlproxy-spike. Wired into tests/test-rust.sh via the
# same excluded-manifest pattern used for d2b-priv-broker.
[workspace]

[package]
name = "d2b-wlattach-spike"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Reconnectable Wayland forwarding prototype: persistent session host + disposable window frontend"

[[bin]]
name = "d2b-wlattach"
path = "src/main.rs"

[dependencies]
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop = "0.14"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
postcard = { version = "1", features = ["use-std"] }
rustix = { version = "1", features = ["net", "fs", "process", "pipe", "mm"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
# `deny`, not `forbid`, because exactly one module needs unsafe: reading wl_shm
# contents, which Smithay exposes only as a raw pointer. See src/serve/sys.rs.
# `forbid` cannot be locally overridden, so a quarantined module requires `deny`.
unsafe_code = "deny"

[lints.clippy]
all = "warn"
# The plan (§5.3) bans panicking on any path fed by the app, the frontend or niri.
unwrap_used = "warn"
expect_used = "warn"
