[package]
name = "d2bd"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
d2bd-runtime = { path = "../d2bd-runtime", version = "0.0.0-bootstrap" }
d2b-contracts-provider = { path = "../d2b-contracts-provider", version = "0.0.0-bootstrap" }
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.2"
libc = "0.2"
nix = { version = "0.29", features = ["fs", "socket", "uio", "user", "signal", "process", "poll"] }
notify-rust = "4"
parking_lot = { version = "0.12", features = ["arc_lock"] }
rustix = { workspace = true }
# v3 resource-runtime rewrite (U9): the per-zone manager actor is spawned
# through the ractor runtime; first consumed by packages/d2bd (this commit).
ractor.workspace = true
thiserror = "2"
d2b-core = { path = "../d2b-core", version = "0.0.0-bootstrap" }
d2b-core-controller = { path = "../d2b-core-controller", version = "0.0.0-bootstrap" }
d2b-zone-routing = { path = "../d2b-zone-routing", version = "0.0.0-bootstrap" }
d2b-provider-system-core = { path = "../d2b-provider-system-core", version = "0.0.0-bootstrap" }
d2b-provider-process-minijail = { path = "../d2b-provider-process-minijail", version = "0.0.0-bootstrap" }
d2b-provider-process-systemd = { path = "../d2b-provider-process-systemd", version = "0.0.0-bootstrap" }
d2b-provider-shell-terminal = { path = "../d2b-provider-shell-terminal", version = "0.0.0-bootstrap" }
d2b-provider-supervisor = { path = "../d2b-provider-supervisor", version = "0.0.0-bootstrap" }
d2b-resource-runtime = { path = "../d2b-resource-runtime", version = "0.0.0-bootstrap" }
d2b-resource-types = { path = "../d2b-resource-types", version = "0.0.0-bootstrap" }
d2b-provider-endpoint = { path = "../d2b-provider-endpoint", version = "0.0.0-bootstrap" }
d2b-provider-guest = { path = "../d2b-provider-guest", version = "0.0.0-bootstrap" }
d2b-provider-telemetry-service = { path = "../d2b-provider-telemetry-service", version = "0.0.0-bootstrap" }
d2b-provider-telemetry-binding = { path = "../d2b-provider-telemetry-binding", version = "0.0.0-bootstrap" }
d2b-provider-volume = { path = "../d2b-provider-volume", version = "0.0.0-bootstrap" }
d2b-provider-volume-binding = { path = "../d2b-provider-volume-binding", version = "0.0.0-bootstrap" }
d2b-provider-zone = { path = "../d2b-provider-zone", version = "0.0.0-bootstrap" }
d2b-provider-zone-link = { path = "../d2b-provider-zone-link", version = "0.0.0-bootstrap" }
d2b-provider-provider = { path = "../d2b-provider-provider", version = "0.0.0-bootstrap" }
d2b-provider-role = { path = "../d2b-provider-role", version = "0.0.0-bootstrap" }
d2b-provider-role-binding = { path = "../d2b-provider-role-binding", version = "0.0.0-bootstrap" }
d2b-provider-quota = { path = "../d2b-provider-quota", version = "0.0.0-bootstrap" }
d2b-provider-emergency-policy = { path = "../d2b-provider-emergency-policy", version = "0.0.0-bootstrap" }
d2b-provider-resource-export = { path = "../d2b-provider-resource-export", version = "0.0.0-bootstrap" }
d2b-provider-resource-import = { path = "../d2b-provider-resource-import", version = "0.0.0-bootstrap" }
d2b-provider-command = { path = "../d2b-provider-command", version = "0.0.0-bootstrap" }
d2b-provider-operation = { path = "../d2b-provider-operation", version = "0.0.0-bootstrap" }
d2b-provider-seccomp-profile = { path = "../d2b-provider-seccomp-profile", version = "0.0.0-bootstrap" }
d2b-provider-host = { path = "../d2b-provider-host", version = "0.0.0-bootstrap" }
d2b-provider-user = { path = "../d2b-provider-user", version = "0.0.0-bootstrap" }
d2b-provider-activation-nixos = { path = "../d2b-provider-activation-nixos", version = "0.0.0-bootstrap" }
d2b-provider-config-nixos = { path = "../d2b-provider-config-nixos", version = "0.0.0-bootstrap" }
d2b-provider-volume-local = { path = "../d2b-provider-volume-local", version = "0.0.0-bootstrap" }
d2b-provider-volume-virtiofs = { path = "../d2b-provider-volume-virtiofs", version = "0.0.0-bootstrap" }
d2b-provider-process = { path = "../d2b-provider-process", version = "0.0.0-bootstrap" }
d2b-process-conformance = { path = "../d2b-process-conformance", version = "0.0.0-bootstrap" }
d2b-bus = { path = "../d2b-bus", version = "0.0.0-bootstrap" }
d2b-session = { path = "../d2b-session", version = "0.0.0-bootstrap" }
d2b-session-unix = { path = "../d2b-session-unix", version = "0.0.0-bootstrap", features = ["host-socket", "native-vsock"] }
d2b-resource-api = { path = "../d2b-resource-api", version = "0.0.0-bootstrap" }
d2b-host = { path = "../d2b-host", version = "0.0.0-bootstrap" }
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
d2b-contracts-broker = { path = "../d2b-contracts-broker", version = "0.0.0-bootstrap" }
d2b-contracts-control = { path = "../d2b-contracts-control", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-audit = { path = "../d2b-audit", version = "0.0.0-bootstrap" }
d2b-provider = { path = "../d2b-provider", version = "0.0.0-bootstrap" }
d2b-provider-device = { path = "../d2b-provider-device", version = "0.0.0-bootstrap" }
d2b-provider-device-tpm = { path = "../d2b-provider-device-tpm", version = "0.0.0-bootstrap" }
d2b-provider-device-security-key = { path = "../d2b-provider-device-security-key", version = "0.0.0-bootstrap" }
d2b-provider-device-usbip = { path = "../d2b-provider-device-usbip", version = "0.0.0-bootstrap" }
d2b-provider-device-gpu = { path = "../d2b-provider-device-gpu", version = "0.0.0-bootstrap" }
d2b-provider-display-wayland = { path = "../d2b-provider-display-wayland", version = "0.0.0-bootstrap" }
d2b-provider-clipboard-wayland = { path = "../d2b-provider-clipboard-wayland", version = "0.0.0-bootstrap" }
d2b-provider-notification-desktop = { path = "../d2b-provider-notification-desktop", version = "0.0.0-bootstrap", features = ["daemon-support"] }
d2b-provider-audio-pipewire = { path = "../d2b-provider-audio-pipewire", version = "0.0.0-bootstrap" }
d2b-provider-network-local = { path = "../d2b-provider-network-local", version = "0.0.0-bootstrap" }
d2b-provider-guest-cloud-hypervisor = { path = "../d2b-provider-guest-cloud-hypervisor", version = "0.0.0-bootstrap" }
d2b-provider-guest-qemu-media = { path = "../d2b-provider-guest-qemu-media", version = "0.0.0-bootstrap" }
d2b-provider-credential = { path = "../d2b-provider-credential", version = "0.0.0-bootstrap" }
d2b-provider-toolkit = { path = "../d2b-provider-toolkit", version = "0.0.0-bootstrap" }
d2b-provider-transport-azure-relay = { path = "../d2b-provider-transport-azure-relay", version = "0.0.0-bootstrap" }
d2b-provider-wayland-policy = { path = "../d2b-provider-wayland-policy", version = "0.0.0-bootstrap" }
d2b-provider-wayland-session = { path = "../d2b-provider-wayland-session", version = "0.0.0-bootstrap" }
d2b-provider-audio-service = { path = "../d2b-provider-audio-service", version = "0.0.0-bootstrap" }
d2b-provider-audio-binding = { path = "../d2b-provider-audio-binding", version = "0.0.0-bootstrap" }
d2b-provider-shell-pool = { path = "../d2b-provider-shell-pool", version = "0.0.0-bootstrap" }
d2b-provider-shell-session = { path = "../d2b-provider-shell-session", version = "0.0.0-bootstrap" }
protobuf = "3.7.2"
serde.workspace = true
sha2 = "0.10"
tracing = "0.1"
# v1.1.1 live-deploy fu9: stderr tracing subscriber for d2bd
# so RUST_LOG=debug actually surfaces in journalctl. Without this
# the daemon initializes no subscriber and every `tracing::error!`
# call (e.g. InternalIo detail) is silently dropped, making live
# debugging impossible.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde_json.workspace = true
socket2 = "0.5"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "fs", "io-util"] }
# R16 (U14): only the ttrpc async surface is used; the `sync` feature is gone.
ttrpc = { workspace = true, features = ["async"] }

[dev-dependencies]
d2b-process-conformance = { path = "../d2b-process-conformance", version = "0.0.0-bootstrap", features = ["test-support"] }
# U100: wired over the binary/service contract in tests/cloud_composition.rs only
d2b-provider-guest-azure-container-apps = { path = "../d2b-provider-guest-azure-container-apps", version = "0.0.0-bootstrap" }
