d2b-provider-guest = { path = "../d2b-provider-guest", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-volume-local = { path = "../d2b-provider-volume-local", version = "0.0.0-bootstrap" }
d2b-provider-process = { path = "../d2b-provider-process", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-volume = { path = "../d2b-provider-volume", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-volume-binding = { path = "../d2b-provider-volume-binding", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-endpoint = { path = "../d2b-provider-endpoint", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-activation-nixos = { path = "../d2b-provider-activation-nixos", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-credential = { path = "../d2b-provider-credential", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-network-local = { path = "../d2b-provider-network-local", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-device = { path = "../d2b-provider-device", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-device-usbip = { path = "../d2b-provider-device-usbip", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-device-security-key = { path = "../d2b-provider-device-security-key", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-device-tpm = { path = "../d2b-provider-device-tpm", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-device-gpu = { path = "../d2b-provider-device-gpu", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-host = { path = "../d2b-provider-host", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-user = { path = "../d2b-provider-user", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-provider = { path = "../d2b-provider-provider", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-notification-desktop = { path = "../d2b-provider-notification-desktop", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-provider-wayland-policy = { path = "../d2b-provider-wayland-policy", version = "0.0.0-bootstrap", features = ["test-support"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
