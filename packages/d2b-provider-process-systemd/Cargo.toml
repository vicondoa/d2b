[package]
name = "d2b-provider-process-systemd"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[dependencies]
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
d2b-contracts-broker = { path = "../d2b-contracts-broker", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-core = { path = "../d2b-core", version = "0.0.0-bootstrap" }
d2b-process-conformance = { path = "../d2b-process-conformance", version = "0.0.0-bootstrap" }
d2b-provider-toolkit = { path = "../d2b-provider-toolkit", version = "0.0.0-bootstrap" }
d2b-resource-runtime = { path = "../d2b-resource-runtime", version = "0.0.0-bootstrap" }
d2b-resource-types = { path = "../d2b-resource-types", version = "0.0.0-bootstrap" }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
tracing = "0.1"
zbus = "5.16"

[dev-dependencies]
d2b-process-conformance = { path = "../d2b-process-conformance", version = "0.0.0-bootstrap", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[features]
test-support = []

# The modules `boundaries` and `controller` consume compile only under the
# `test-support` feature, so these tests need it.
[[test]]
name = "boundaries"
path = "tests/boundaries.rs"
required-features = ["test-support"]

[[test]]
name = "controller"
path = "tests/controller.rs"
required-features = ["test-support"]
