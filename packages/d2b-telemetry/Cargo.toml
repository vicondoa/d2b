[package]
name = "d2b-telemetry"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
d2b-contracts-provider = { path = "../d2b-contracts-provider", version = "0.0.0-bootstrap" }
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustix = { workspace = true }

# U33: this crate does not inherit `[workspace.lints]` (it carries its own lint
# posture), but `clippy.toml` at the workspace root arms
# `clippy::disallowed_methods` for every crate clippy checks - the lint is
# warn-by-default and the blocking-API list is what makes it fire, so the
# workspace lint table is not what turns it on. Without the levels below the
# workspace's pre-existing blocking calls would fail this crate's build under
# the repo's `-D warnings`. TEMPORARY: the `disallowed_methods` allowance goes
# away together with the workspace-level one in the root manifest - see the
# removal condition there; `await_holding_lock` is already a live denial.
[lints.clippy]
disallowed_methods = "allow"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
