[package]
name = "d2b-resource-types"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints]
workspace = true

[features]
# `assert_metadata_registration` is needed by the eleven per-type crates'
# `tests/registration.rs` suites (which opt in via the `test-support` feature)
# and by this crate's own tests. Gating on `any(test, feature = "test-support")`
# makes the helper available automatically when compiling this crate's tests,
# so `cargo test -p d2b-resource-types` works without anyone having to
# remember `--features test-support`.
test-support = []

[dependencies]
d2b-contracts-broker = { path = "../d2b-contracts-broker", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-core = { path = "../d2b-core", version = "0.0.0-bootstrap" }
d2b-resource-runtime = { path = "../d2b-resource-runtime", version = "0.0.0-bootstrap" }
async-trait = "0.1"
bitflags = "2"
