[package]
name = "d2b-resource-compiler"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
d2b-contracts-provider = { path = "../d2b-contracts-provider", version = "0.0.0-bootstrap" }
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
base64.workspace = true
d2b-core = { path = "../d2b-core", version = "0.0.0-bootstrap" }
ring.workspace = true
rustix = { workspace = true, features = ["runtime"] }
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[bin]]
name = "d2b-resource-compiler"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

# U33: this crate does not inherit `[workspace.lints]` (it carries its own lint
# posture), but `clippy.toml` at the workspace root arms
# `clippy::disallowed_methods` for every crate clippy checks - the lint is
# warn-by-default and the blocking-API list is what makes it fire, so the
# workspace lint table is not what turns it on. KTD5 (U15): the crate's
# blocking-API census is zero (surviving sites are CLI-path and cfg(test)
# helpers carrying policy-tracked sanctioned allows), so `disallowed_methods`
# flips to deny ahead of the workspace-wide flip; `await_holding_lock` is
# already a live denial.
[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
