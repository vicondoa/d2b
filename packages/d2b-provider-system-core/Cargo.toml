[package]
name = "d2b-provider-system-core"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[dependencies]
async-trait = "0.1"
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
tracing = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }

[features]
test-support = []

[[test]]
name = "host_reconciliation"
path = "tests/host_reconciliation.rs"
required-features = ["test-support"]

[[test]]
name = "ownership"
path = "tests/ownership.rs"
required-features = ["test-support"]

[[test]]
name = "user_discovery"
path = "tests/user_discovery.rs"
required-features = ["test-support"]
