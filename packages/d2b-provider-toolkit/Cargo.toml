[package]
name = "d2b-provider-toolkit"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[features]
default = ["unix-transport"]
unix-transport = ["dep:d2b-session-unix", "d2b-session-unix/host-socket"]

[lints]
workspace = true

[dependencies]
d2b-contracts-provider = { path = "../d2b-contracts-provider", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
d2b-provider = { path = "../d2b-provider", version = "0.0.0-bootstrap" }
d2b-session = { path = "../d2b-session", version = "0.0.0-bootstrap" }
d2b-session-unix = { path = "../d2b-session-unix", version = "0.0.0-bootstrap", default-features = false, optional = true }
schemars.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
d2b-session = { path = "../d2b-session", version = "0.0.0-bootstrap", features = ["test-support"] }
sha2.workspace = true

[[bin]]
name = "d2b-provider-toolkit"
path = "src/bin/d2b-provider-toolkit.rs"
