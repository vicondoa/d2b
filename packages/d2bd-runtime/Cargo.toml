[package]
name = "d2bd-runtime"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
async-trait = "0.1"
arc-swap = "1"
d2b-audit = { path = "../d2b-audit", version = "0.0.0-bootstrap" }
d2b-bus = { path = "../d2b-bus", version = "0.0.0-bootstrap" }
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
d2b-contracts-broker = { path = "../d2b-contracts-broker", version = "0.0.0-bootstrap" }
d2b-contracts-control = { path = "../d2b-contracts-control", version = "0.0.0-bootstrap" }
d2b-contracts-provider = { path = "../d2b-contracts-provider", version = "0.0.0-bootstrap" }
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-core = { path = "../d2b-core", version = "0.0.0-bootstrap" }
d2b-core-controller = { path = "../d2b-core-controller", version = "0.0.0-bootstrap" }
d2b-host = { path = "../d2b-host", version = "0.0.0-bootstrap" }
d2b-resource-api = { path = "../d2b-resource-api", version = "0.0.0-bootstrap" }
d2b-resource-store = { path = "../d2b-resource-store", version = "0.0.0-bootstrap" }
d2b-resource-store-redb = { path = "../d2b-resource-store-redb", version = "0.0.0-bootstrap" }
d2b-realm-core = { path = "../d2b-realm-core", version = "0.0.0-bootstrap" }
d2b-session = { path = "../d2b-session", version = "0.0.0-bootstrap" }
d2b-session-unix = { path = "../d2b-session-unix", version = "0.0.0-bootstrap", features = ["host-socket", "native-vsock"] }
libc = "0.2"
getrandom = "0.2"
nix = { version = "0.29", features = ["fs", "socket", "uio", "user", "signal", "process", "poll"] }
parking_lot = { version = "0.12", features = ["arc_lock"] }
protobuf = "3.7.2"
rustix = { workspace = true }
semver = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
socket2 = "0.5"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tracing = "0.1"
ttrpc = { version = "0.9.0", default-features = false, features = ["async", "sync"] }
uzers = "0.12"

[dev-dependencies]
d2b-core = { path = "../d2b-core", version = "0.0.0-bootstrap", features = ["test-support"] }
d2b-core-controller = { path = "../d2b-core-controller", version = "0.0.0-bootstrap", features = ["test-support"] }
regex = "1"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
