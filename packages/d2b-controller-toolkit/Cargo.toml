[package]
name = "d2b-controller-toolkit"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints]
workspace = true

[dependencies]
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
schemars.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
d2b-resource-api = { path = "../d2b-resource-api", version = "0.0.0-bootstrap" }
d2b-resource-store-redb = { path = "../d2b-resource-store-redb", version = "0.0.0-bootstrap" }
d2b-resource-store = { path = "../d2b-resource-store", version = "0.0.0-bootstrap" }
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread"] }
