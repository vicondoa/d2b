[package]
name = "d2b-bus"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
d2b-resource-api = { path = "../d2b-resource-api", version = "0.0.0-bootstrap" }
d2b-session = { path = "../d2b-session", version = "0.0.0-bootstrap" }
serde.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
d2b-resource-store = { path = "../d2b-resource-store", version = "0.0.0-bootstrap" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util"] }
