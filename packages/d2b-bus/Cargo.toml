[package]
name = "d2b-bus"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints.rust]
unsafe_code = "forbid"
# Mirrors the workspace table (kept local because a crate-local [lints]
# cannot coexist with `workspace = true`): the opt-in cfg flags used by
# d2b-bus/d2bd tests are declared so `unexpected_cfgs` stays quiet.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(test_root)",
    "cfg(d2b_capability_trait_mutation, values(\"authenticated-component-session-clone\", \"authenticated-component-session-default\", \"component-session-admission-clone\", \"component-session-admission-default\", \"component-session-admission-from-unit\", \"session-acceptor-clone\", \"session-acceptor-default\", \"verified-unix-peer-clone\", \"verified-unix-peer-default\", \"verified-unix-peer-from-unit\"))",
] }

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[dependencies]
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
async-trait = "0.1"
d2b-core-controller = { path = "../d2b-core-controller", version = "0.0.0-bootstrap" }
d2b-resource-api = { path = "../d2b-resource-api", version = "0.0.0-bootstrap" }
d2b-telemetry = { path = "../d2b-telemetry", version = "0.0.0-bootstrap" }
d2b-session = { path = "../d2b-session", version = "0.0.0-bootstrap" }
d2b-session-unix = { path = "../d2b-session-unix", version = "0.0.0-bootstrap", default-features = false, features = ["host-socket"] }
# snow-constrained: keep 0.3 inline until a snow bump (U100)
getrandom = "0.3"
sha2.workspace = true
snow = { version = "0.10", features = ["risky-raw-split"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "sync", "time"] }

[dev-dependencies]
d2b-contracts-provider = { path = "../d2b-contracts-provider", version = "0.0.0-bootstrap" }
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util"] }
protobuf = "3.7.2"
ttrpc = { workspace = true, features = ["async"] }
