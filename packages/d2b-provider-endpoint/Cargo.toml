[package]
name = "d2b-provider-endpoint"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[features]
test-support = []

[dependencies]
async-trait = "0.1"
d2b-contracts-broker = { path = "../d2b-contracts-broker", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-provider-device-tpm = { path = "../d2b-provider-device-tpm", version = "0.0.0-bootstrap" }
d2b-provider-guest-cloud-hypervisor = { path = "../d2b-provider-guest-cloud-hypervisor", version = "0.0.0-bootstrap" }
d2b-provider-toolkit = { path = "../d2b-provider-toolkit", version = "0.0.0-bootstrap" }
d2b-resource-runtime = { path = "../d2b-resource-runtime", version = "0.0.0-bootstrap" }
d2b-resource-types = { path = "../d2b-resource-types", version = "0.0.0-bootstrap" }
parking_lot = "0.12"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# The privileged exact-endpoint resolution the delivery is reconciled against.
d2b-broker = { path = "../d2b-broker", version = "0.0.0-bootstrap" }
d2b-core = { path = "../d2b-core", version = "0.0.0-bootstrap" }
tempfile = "3"
# Paused-time test clock for the realize-budget timeout case.
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "endpoint_binding"
path = "tests/endpoint_binding.rs"

[[test]]
name = "endpoint_delivery"
path = "tests/endpoint_delivery.rs"
