[package]
name = "d2b-audit"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
d2b-telemetry = { path = "../d2b-telemetry", version = "0.0.0-bootstrap" }
libc = "0.2"
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The unit-test scratch-root resolver lives in d2b-core's feature-gated
# `test_support`; only cfg(test) code consumes it, so it stays a dev-dep.
d2b-core = { path = "../d2b-core", version = "0.0.0-bootstrap", features = ["test-support"] }

# U33: this crate does not inherit `[workspace.lints]` (it carries its own lint
# posture), but `clippy.toml` at the workspace root arms
# `clippy::disallowed_methods` for every crate clippy checks - the lint is
# warn-by-default and the blocking-API list is what makes it fire, so the
# workspace lint table is not what turns it on. KTD5 (U15): the crate's
# blocking-API census is zero (the synchronous library surface's surviving
# sites carry policy-tracked "synchronous path" / "cfg(test) helper" allows),
# so `disallowed_methods` flips to deny ahead of the workspace-wide flip;
# `await_holding_lock` is already a live denial.
[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
