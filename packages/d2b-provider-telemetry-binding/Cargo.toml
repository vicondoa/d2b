[package]
name = "d2b-provider-telemetry-binding"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[dependencies]
async-trait = "0.1"
d2b-contracts-provider = { path = "../d2b-contracts-provider", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-core-controller = { path = "../d2b-core-controller", version = "0.0.0-bootstrap" }
d2b-provider-observability-otel = { path = "../d2b-provider-observability-otel", version = "0.0.0-bootstrap" }
d2b-resource-runtime = { path = "../d2b-resource-runtime", version = "0.0.0-bootstrap" }
d2b-resource-types = { path = "../d2b-resource-types", version = "0.0.0-bootstrap" }
serde_json.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
