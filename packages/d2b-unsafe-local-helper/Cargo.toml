[package]
name = "d2b-unsafe-local-helper"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true
description = "Same-uid user-session runtime helper for d2b unsafe-local workloads"

# U18: the helper is a synchronous subprocess (no executor anywhere in its
# call graph), so every surviving blocking-API site carries an inline,
# policy-tracked allow with a sanctioned reason; deny keeps new sites out.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
d2b-contracts-control = { path = "../d2b-contracts-control", version = "0.0.0-bootstrap" }
getrandom = "0.2"
nix = { version = "0.29", features = ["fs", "poll", "socket", "uio", "user", "signal", "process"] }
rustix = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true }
socket2 = "0.5"
tracing = "0.1"
uzers = "0.12"
zbus = { version = "5.16", features = ["blocking-api"] }
