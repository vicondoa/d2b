[dependencies]
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
d2b-controller-toolkit = { path = "../d2b-controller-toolkit", version = "0.0.0-bootstrap" }
d2b-resource-store = { path = "../d2b-resource-store", version = "0.0.0-bootstrap" }
redb = { version = "=4.1.0", default-features = false }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
