[package]
name = "xtask"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
default-run = "xtask"
license.workspace = true

# U33/U15: this crate carries its own lint posture (a crate-local `[lints]`
# cannot coexist with `workspace = true`), mirroring the workspace levels:
# `unsafe_code = "forbid"` (the workspace root's) and the three clippy levels.
# The blocking-API census reached zero at U15 (every remaining site in src/
# and tests/ carries a policy-tracked "CLI-only path" / "cfg(test) helper"
# allow), so `disallowed_methods` flips to deny ahead of the workspace-wide
# flip; `await_holding_lock` and `await_holding_refcell_ref` are live denials.
# xtask uses none of the opt-in cfg flags, so no `unexpected_cfgs` entry is
# needed here.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[dependencies]
d2b-contracts-provider = { path = "../d2b-contracts-provider", version = "0.0.0-bootstrap" }
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
# Keep the generated CLI artifacts compatible with the established
# positional-value completion contract. clap_complete 4.6.6+ intentionally
# omits positional usage placeholders from Bash output.
clap_complete = "=4.6.5"
clap_mangen = "0.2"
d2b = { path = "../d2b", version = "0.0.0-bootstrap" }
d2b-core = { path = "../d2b-core", version = "0.0.0-bootstrap" }
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
d2b-contracts-broker = { path = "../d2b-contracts-broker", version = "0.0.0-bootstrap" }
d2b-contracts-control = { path = "../d2b-contracts-control", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
# The delivery state writer uses nix for libc constants and effective-UID
# checks. Keep the feature surface limited to the user APIs it calls.
nix = { version = "0.29", default-features = false, features = ["user"] }
# Directory-descriptor-anchored file operations for the delivery state
# writer: `openat`/`openat2`/`mkdirat`/`renameat`/`unlinkat`/`fsync` relative
# to a pinned, verified parent fd, so a temp create, rename, and directory
# fsync cannot be redirected by a symlink swapped in after the component walk.
# `nix` 0.29 returns a bare `RawFd` from `openat`, which would need `unsafe` to
# own; the crate forbids `unsafe`, so `rustix` (already a workspace dependency
# used by d2b, d2bd, and the broker, so no new supply-chain edge) is the only
# way to get an owned, safe anchored-open API.
rustix = { workspace = true }
protobuf-codegen = "3.7.2"
# The gen-daemon-api IPC declaration scan slices each item's braced body out
# of the original source text via its syn span (already in the lockfile via
# syn/schemars), so the rendered doc stays byte-identical to the line-based
# extraction.
proc-macro2 = { version = "1", features = ["span-locations"] }
serde.workspace = true
# The gen-daemon-api IPC declaration scan parses the contract sources with
# syn (already in the lockfile via schemars), replacing the hand-rolled
# brace-counted `pub struct`/`pub enum` line scanner.
syn = { version = "2", features = ["full", "visit"] }
ttrpc-codegen = "0.6.0"
schemars.workspace = true
serde_json.workspace = true
sha2.workspace = true



d2b-provider-endpoint = { path = "../d2b-provider-endpoint", version = "0.0.0-bootstrap" }
d2b-provider-guest = { path = "../d2b-provider-guest", version = "0.0.0-bootstrap" }
d2b-provider-command = { path = "../d2b-provider-command", version = "0.0.0-bootstrap" }
d2b-provider-operation = { path = "../d2b-provider-operation", version = "0.0.0-bootstrap" }
d2b-provider-seccomp-profile = { path = "../d2b-provider-seccomp-profile", version = "0.0.0-bootstrap" }
[dev-dependencies]
serde_json.workspace = true
