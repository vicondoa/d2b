[package]
name = "d2b-provider-supervisor"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints]
workspace = true

[dependencies]
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
d2b-process = { path = "../d2b-process", version = "0.0.0-bootstrap" }
d2b-process-conformance = { path = "../d2b-process-conformance", version = "0.0.0-bootstrap" }
d2b-telemetry = { path = "../d2b-telemetry", version = "0.0.0-bootstrap" }
rustix = { workspace = true, features = ["event"] }
sha2 = { workspace = true }
socket2 = "0.5"

[dev-dependencies]
d2b-provider-system-minijail = { path = "../d2b-provider-system-minijail", version = "0.0.0-bootstrap" }
d2b-provider-system-systemd = { path = "../d2b-provider-system-systemd", version = "0.0.0-bootstrap" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
