[package]
name = "d2b-sk-frontend"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license = "Apache-2.0"



[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(test_root)"] }

[features]
default = []

[dependencies]
async-trait = "0.1"
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
d2b-provider-toolkit = { path = "../d2b-provider-toolkit", version = "0.0.0-bootstrap" }
d2b-session = { path = "../d2b-session", version = "0.0.0-bootstrap" }
d2b-session-unix = { path = "../d2b-session-unix", version = "0.0.0-bootstrap" }
libc = "0.2"
# rustix for the non-blocking uhid read/write syscalls inside the AsyncFd
# readiness loops (the d2b-session-unix pattern); already a workspace
# dependency, so no new supply-chain edge.
rustix = { workspace = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-vsock = "0.7"

# U33: this crate does not inherit `[workspace.lints]` (it carries its own lint
# posture), but `clippy.toml` at the workspace root arms
# `clippy::disallowed_methods` for every crate clippy checks - the lint is
# warn-by-default and the blocking-API list is what makes it fire, so the
# workspace lint table is not what turns it on. KTD5 (U15): the crate's
# blocking-API census is zero (uhid device open over tokio::fs, the AsyncFd
# readiness loops over rustix::io), so `disallowed_methods` flips to deny
# ahead of the workspace-wide flip; `await_holding_lock` is already a live
# denial.
[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
