[package]
name = "d2b-provider-guest-azure-container-apps"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
d2b-contracts-provider = { path = "../d2b-contracts-provider", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
serde = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = "0.1"

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
