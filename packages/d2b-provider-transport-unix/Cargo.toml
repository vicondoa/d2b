[package]
name = "d2b-provider-transport-unix"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[dependencies]
tokio = { workspace = true, features = ["sync"] }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
# snow-constrained: keep 0.3 inline until a snow bump (U100)
getrandom = "0.3"
tracing = "0.1"
rustix = { workspace = true, features = ["event"] }
