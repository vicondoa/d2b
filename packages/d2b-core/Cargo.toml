[package]
name = "d2b-core"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lib]
test = false
doctest = false

[lints]
workspace = true

[features]
fuzz = ["dep:bolero"]
test-support = []

[dependencies]
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# P0: O_NOFOLLOW open + fstat for bundle artifact tamper detection.
rustix = { workspace = true }
# P0: SHA-256 self-hash verification of bundle.json.
sha2 = { workspace = true }
# The bounded loader worker hands each job's outcome back to an awaiting
# caller; `sync::oneshot` is a waker channel with no runtime or reactor
# requirement, so the worker stays usable from any executor.
tokio = { workspace = true, features = ["sync"] }
# Bundle-load warnings (e.g. a pre-v2 bundle without bundleHash) are
# emitted as structured records so the daemon's subscriber surfaces them.
tracing = "0.1"
bolero = { version = "0.10", optional = true }

[dev-dependencies]
nix = { version = "0.29", features = ["user", "fs"] }
serde_json.workspace = true
tempfile = "3"

[[test]]
name = "d2b-core-smoke"
path = "fuzz/src/bin/core.rs"
harness = false

[[test]]
name = "d2b-core-fuzz-manifest"
path = "fuzz/src/bin/manifest.rs"
harness = false
required-features = ["fuzz"]

[[test]]
name = "d2b-core-fuzz-bundle"
path = "fuzz/src/bin/bundle.rs"
harness = false
required-features = ["fuzz"]

[[test]]
name = "d2b-core-fuzz-host"
path = "fuzz/src/bin/host.rs"
harness = false
required-features = ["fuzz"]

[[test]]
name = "d2b-core-fuzz-privileges"
path = "fuzz/src/bin/privileges.rs"
harness = false
required-features = ["fuzz"]

[[test]]
name = "bundle-resolver-tamper"
path = "tests/bundle_resolver_tamper.rs"

# The loader-worker contract tests drive futures through the no-op-waker
# driver in `test_support`, so they need the library built with the
# `test-support` feature (same pattern as the provider registration tests).
[[test]]
name = "loader_worker"
path = "tests/loader_worker.rs"
required-features = ["test-support"]

[[test]]
name = "loader_worker_panic"
path = "tests/loader_worker_panic.rs"
required-features = ["test-support"]
