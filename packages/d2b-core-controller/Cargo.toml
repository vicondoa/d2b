[package]
name = "d2b-core-controller"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true
# `src/main.rs` is a library module scaffold, not a binary target. Auto-discovery
# is off so cargo does not claim it as one; the slice that turns it into the
# fixed core-controller process declares the target it wants.
autobins = false

[lints]
workspace = true

[dependencies]
d2b-audit = { path = "../d2b-audit", version = "0.0.0-bootstrap" }
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
d2b-controller-toolkit = { path = "../d2b-controller-toolkit", version = "0.0.0-bootstrap" }
d2b-telemetry = { path = "../d2b-telemetry", version = "0.0.0-bootstrap" }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
