[package]
name = "d2b-provider-zone-link"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[features]
test-support = []

[dependencies]
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-resource-types = { path = "../d2b-resource-types", version = "0.0.0-bootstrap" }
serde.workspace = true
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
 serde_json.workspace = true

[dev-dependencies]
d2b-resource-types = { path = "../d2b-resource-types", version = "0.0.0-bootstrap", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "registration"
path = "tests/registration.rs"
required-features = ["test-support"]
