[package]
name = "d2b-session-unix"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[features]
default = ["host-socket", "native-vsock"]
host-socket = ["dep:tokio"]
native-vsock = [
    "dep:tokio",
    "dep:tokio-vsock",
]
test-support = []

[dependencies]
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
async-trait = "0.1"
tracing = "0.1"
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
d2b-session = { path = "../d2b-session", version = "0.0.0-bootstrap" }
envmnt = "0.10"
libc = "0.2"
listenfd = "1"
nix = { version = "0.29", default-features = false, features = ["fs"] }
rustix.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util", "net"] }
tokio-vsock = { version = "0.7.2", optional = true }
uapi = "0.2"
zeroize = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "test-util", "time"] }

# Mirrors the workspace table (kept local because a crate-local [lints]
# cannot coexist with `workspace = true`): U19 flip per plan KTD5 - the
# crate's blocking-API census is zero (sanctioned per-site allows only).
[lints.rust]
unsafe_code = "forbid"
# The opt-in cfg flags used by this crate's tests are declared so
# `unexpected_cfgs` stays quiet (mirroring the workspace table).
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(test_root)",
    "cfg(d2b_capability_trait_mutation, values(\"authenticated-component-session-clone\", \"authenticated-component-session-default\", \"component-session-admission-clone\", \"component-session-admission-default\", \"component-session-admission-from-unit\", \"session-acceptor-clone\", \"session-acceptor-default\", \"verified-unix-peer-clone\", \"verified-unix-peer-default\", \"verified-unix-peer-from-unit\"))",
] }

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref ="deny"

[[test]]
name = "unix_session"
required-features = ["host-socket"]
