[package]
name = "d2b-provider-transport-vsock"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[dependencies]
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
async-trait = "0.1"
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-session = { path = "../d2b-session", version = "0.0.0-bootstrap" }
tracing = "0.1"
ring.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "sync", "time"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "test-util", "time"] }

[[test]]
name = "host_guest"
path = "integration/host_guest.rs"

[[test]]
name = "no_fd_transfer"
path = "integration/no_fd_transfer.rs"
