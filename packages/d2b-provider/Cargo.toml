[package]
name = "d2b-provider"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints]
workspace = true

[dependencies]
d2b-bus = { path = "../d2b-bus", version = "0.0.0-bootstrap" }
d2b-contracts-provider = { path = "../d2b-contracts-provider", version = "0.0.0-bootstrap" }
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
# Reused rather than restated: `ZoneRouteEngine::admit_relay_hop` is the one
# owner of the D040 relay-plus-target-verb hop rule.
d2b-zone-routing = { path = "../d2b-zone-routing", version = "0.0.0-bootstrap" }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
d2b-zone-routing = { path = "../d2b-zone-routing", version = "0.0.0-bootstrap", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
