[package]
name = "d2b-provider-emergency-policy"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[features]
test-support = []

[dependencies]
# U40: the type's own enforcement speaks the canonical refusal vocabulary and
# the canonical EmergencyPolicy contract. Neither is re-declared here: the
# provider owns when a reduction refuses and drains, the contracts own what a
# policy row says and what a refusal is called.
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
d2b-resource-types = { path = "../d2b-resource-types", version = "0.0.0-bootstrap" }

[dev-dependencies]
d2b-resource-types = { path = "../d2b-resource-types", version = "0.0.0-bootstrap", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "registration"
path = "tests/registration.rs"
required-features = ["test-support"]
