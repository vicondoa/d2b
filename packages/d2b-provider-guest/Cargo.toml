[package]
name = "d2b-provider-guest"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[dependencies]
async-trait = "0.1"
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-resource-runtime = { path = "../d2b-resource-runtime", version = "0.0.0-bootstrap" }
d2bd-runtime = { path = "../d2bd-runtime", version = "0.0.0-bootstrap" }
d2b-resource-types = { path = "../d2b-resource-types", version = "0.0.0-bootstrap" }
d2b-provider-guest-cloud-hypervisor = { path = "../d2b-provider-guest-cloud-hypervisor", version = "0.0.0-bootstrap" }
d2b-provider-guest-qemu-media = { path = "../d2b-provider-guest-qemu-media", version = "0.0.0-bootstrap" }
d2b-provider-guest-azure-container-apps = { path = "../d2b-provider-guest-azure-container-apps", version = "0.0.0-bootstrap" }
d2b-provider-guest-azure-virtual-machine = { path = "../d2b-provider-guest-azure-virtual-machine", version = "0.0.0-bootstrap" }
d2b-provider-toolkit = { path = "../d2b-provider-toolkit", version = "0.0.0-bootstrap" }
d2b-contracts-provider = { path = "../d2b-contracts-provider", version = "0.0.0-bootstrap" }
sha2 = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
thiserror = "2"
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
ttrpc = { workspace = true, features = ["async", "sync"] }

[features]
test-support = []

[[test]]
name = "registration"
path = "tests/registration.rs"
required-features = ["test-support"]
