[package]
name = "d2b-host-activation-helper"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# U33: this crate does not inherit `[workspace.lints]` (it carries its own lint
# posture), but `clippy.toml` at the workspace root arms
# `clippy::disallowed_methods` for every crate clippy checks - the lint is
# warn-by-default and the blocking-API list is what makes it fire, so the
# workspace lint table is not what turns it on. KTD5 (U15): the crate's
# blocking-API census is zero (surviving sites are cfg(test) helpers carrying
# policy-tracked sanctioned allows), so `disallowed_methods` flips to deny
# ahead of the workspace-wide flip; `await_holding_lock` is already a live
# denial.
[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
