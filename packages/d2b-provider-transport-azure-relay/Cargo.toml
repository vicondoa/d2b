[package]
name = "d2b-provider-transport-azure-relay"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
futures-util = "0.3"
hmac = "0.12"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
urlencoding = "2"
webpki-roots = "0.26"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "sync", "time"] }
