[package]
name = "d2b-provider-transport-azure-relay"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
d2b-realm-core = { path = "../d2b-realm-core", version = "0.0.0-bootstrap" }
d2b-realm-provider = { path = "../d2b-realm-provider", version = "0.0.0-bootstrap" }
hmac = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
urlencoding = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "sync", "time"] }
