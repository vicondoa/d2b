[package]
name = "d2b-gateway-runtime"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

# Top-level gateway composition (ADR 0032): ties the codec-neutral
# d2b-gateway orchestrator/handshake to the canonical Azure Relay transport
# and ACA runtime Provider crates.
# This is the only crate that depends on both the gateway and the providers; it
# is where the per-session handshake becomes the relay prologue that gates the
# display byte stream. Nothing else depends on it (it is the composition root
# consumed by the gateway-mode daemon).
[dependencies]
d2b-gateway = { path = "../d2b-gateway", version = "0.0.0-bootstrap" }
futures-util = "0.3"
d2b-provider-transport-azure-relay = { path = "../d2b-provider-transport-azure-relay", version = "0.0.0-bootstrap" }
d2b-provider-runtime-azure-container-apps = { path = "../d2b-provider-runtime-azure-container-apps", version = "0.0.0-bootstrap" }
d2b-realm-core = { path = "../d2b-realm-core", version = "0.0.0-bootstrap" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "0.26"
base64 = "0.22"
libc = "0.2"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"
zeroize = "1"

[dev-dependencies]
azure_core = "1.0.0"
tempfile = "3"
