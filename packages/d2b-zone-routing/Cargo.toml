[package]
name = "d2b-zone-routing"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[features]
test-support = []

# Mirrors the workspace table (kept local because a crate-local [lints]
# cannot coexist with `workspace = true`): U19 flip per plan KTD5 - the
# crate's blocking-API census is zero (sanctioned per-site allows only).
[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[dependencies]
d2b-bus = { path = "../d2b-bus", version = "0.0.0-bootstrap" }
d2b-contracts-zone-session = { path = "../d2b-contracts-zone-session", version = "0.0.0-bootstrap" }
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-contracts = { path = "../d2b-contracts", version = "0.0.0-bootstrap" }
d2b-session = { path = "../d2b-session", version = "0.0.0-bootstrap" }

[dev-dependencies]
async-trait = "0.1"
d2b-provider-toolkit = { path = "../d2b-provider-toolkit", version = "0.0.0-bootstrap" }
d2b-session-unix = { path = "../d2b-session-unix", version = "0.0.0-bootstrap" }
d2b-sk-frontend = { path = "../d2b-sk-frontend", version = "0.0.0-bootstrap" }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }

[[bench]]
name = "route_decision"
harness = false
required-features = ["test-support"]

[[test]]
name = "route_engine_vectors"
path = "tests/route_engine_vectors.rs"
required-features = ["test-support"]

[[test]]
name = "guest_enrollment"
path = "tests/guest_enrollment.rs"
