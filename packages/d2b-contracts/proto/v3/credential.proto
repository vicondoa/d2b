syntax = "proto3";

package d2b.credential.v3;

service CredentialService {
  rpc AcquireToken(CredentialRequest) returns (AcquireTokenResponse);
  rpc RefreshToken(CredentialRequest) returns (RefreshTokenResponse);
  rpc RevokeToken(CredentialRequest) returns (RevokeTokenResponse);
  rpc SignChallenge(CredentialRequest) returns (SignChallengeResponse);
  rpc InspectMetadata(CredentialRequest) returns (InspectMetadataResponse);
}

message CredentialRequest {
  string credential_ref = 1;
  string operation_id = 2;
  string idempotency_key = 3;
  uint64 requested_expiry_unix_ms = 4;
  uint64 deadline_unix_ms = 5;
}

message CredentialMetadata {
  string lease_handle = 1;
  uint64 rotation_generation = 2;
  string source_version = 3;
  uint64 expires_at_unix_ms = 4;
  CredentialLeaseState state = 5;
  CredentialOutcomeCode outcome = 6;
}

message DeliverySessionParams {
  string credential_ref = 1;
  string credential_uid = 2;
  uint64 credential_generation = 3;
  string consumer_provider_ref = 4;
  uint64 consumer_component_generation = 5;
  string audience = 6;
  CredentialOperationClass operation_class = 7;
  uint64 expiry_unix_ms = 8;
  uint64 deadline_unix_ms = 9;
  string route_digest = 10;
  uint32 schema_version = 11;
  uint32 max_token_bytes = 12;
  uint64 sequence = 13;
}

message AcquireTokenResponse {
  CredentialMetadata metadata = 1;
  DeliverySessionParams delivery_session_params = 2;
}

message RefreshTokenResponse {
  CredentialMetadata metadata = 1;
  DeliverySessionParams delivery_session_params = 2;
}

message RevokeTokenResponse {
  CredentialMetadata metadata = 1;
}

message SignChallengeResponse {
  CredentialMetadata metadata = 1;
  DeliverySessionParams delivery_session_params = 2;
}

message InspectMetadataResponse {
  CredentialMetadata metadata = 1;
}

enum CredentialOperationClass {
  CREDENTIAL_OPERATION_CLASS_UNSPECIFIED = 0;
  CREDENTIAL_OPERATION_CLASS_ACQUIRE_TOKEN = 1;
  CREDENTIAL_OPERATION_CLASS_REFRESH_TOKEN = 2;
  CREDENTIAL_OPERATION_CLASS_REVOKE_TOKEN = 3;
  CREDENTIAL_OPERATION_CLASS_SIGN_CHALLENGE = 4;
  CREDENTIAL_OPERATION_CLASS_INSPECT_METADATA = 5;
}

enum CredentialLeaseState {
  CREDENTIAL_LEASE_STATE_UNSPECIFIED = 0;
  CREDENTIAL_LEASE_STATE_ACTIVE = 1;
  CREDENTIAL_LEASE_STATE_EXPIRED = 2;
  CREDENTIAL_LEASE_STATE_REVOKED = 3;
  CREDENTIAL_LEASE_STATE_UNKNOWN = 4;
}

enum CredentialOutcomeCode {
  CREDENTIAL_OUTCOME_CODE_UNSPECIFIED = 0;
  CREDENTIAL_OUTCOME_CODE_SUCCESS = 1;
  CREDENTIAL_OUTCOME_CODE_REVOKED = 2;
  CREDENTIAL_OUTCOME_CODE_ALREADY_REVOKED = 3;
}
