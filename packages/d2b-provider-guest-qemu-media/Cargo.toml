[package]
name = "d2b-provider-guest-qemu-media"
version = "0.0.0-bootstrap"
edition = "2024"
publish = false
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

[dependencies]
d2b-contracts-resource = { path = "../d2b-contracts-resource", version = "0.0.0-bootstrap" }
d2b-core = { path = "../d2b-core", version = "0.0.0-bootstrap" }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = "0.1"

[dev-dependencies]
serde_json = { workspace = true }

[[test]]
name = "qemu_media_integration"
path = "integration/mod.rs"
