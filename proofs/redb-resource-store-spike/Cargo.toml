[package]
name = "redb-resource-store-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
nix = { version = "0.29", default-features = false, features = ["process", "signal"] }
redb = { version = "=4.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }

[[bench]]
name = "commit_to_handler"
harness = false

[workspace]
