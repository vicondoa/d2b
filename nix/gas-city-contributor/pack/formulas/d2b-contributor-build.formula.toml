description = """
Contributor build entry that keeps native Compound Engineering stages and
replaces only the final mixed comment-resolution seam.
"""
formula = "d2b-contributor-build"
version = 1
contract = "graph.v2"
extends = ["compound-build"]
target_required = true

[catalog]
name = "d2b-contributor-build"
description = "Native Compound Engineering build with separated comment judgment, edit, and verification."

[[steps]]
id = "finalize"
title = "Finalize separated Compound Engineering resolution"
needs = ["review"]
metadata = { "gc.run_target" = "compound-engineering.ce-compound", "gc.build.artifact_schema" = "gc.build.final-report.v1", "gc.build.artifact_path_keys" = "gc.build.final_report_path", "gc.decision_formula" = "d2b-decision" }
expand = "d2b-compound-resolution"
description_file = "../assets/workflows/d2b-contributor-build/finalize.md"

[[steps]]
id = "publish"
title = "Publish the exact committed branch as a reviewable pull request"
needs = ["finalize"]
metadata = { "gc.run_target" = "gc.publisher", "gc.publisher.helper" = "publish-pr.py", "gc.publisher.transport" = "bundle-fd-v1", "gc.publisher.ref_update" = "non-force-exact", "gc.publisher.merge" = "forbidden", "gc.publisher.notify" = "discord-after-url" }
description_file = "../assets/workflows/d2b-contributor-build/publish.md"
