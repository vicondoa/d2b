description = """
Separated contributor resolution expansion.

The judgment and verification lanes are read-only Sol review sessions.  The
only editing lane is native Compound Engineering ce-work, which uses the Luna
coding profile.  Native ce-compound remains the final synthesis authority.
"""
formula = "d2b-compound-resolution"
type = "expansion"
version = 1
contract = "graph.v2"

[[template]]
id = "{target}.inventory-artifacts"
title = "Inventory Compound Engineering resolution artifacts"
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/d2b-compound-resolution/{target}.inventory-artifacts.md"

[[template]]
id = "{target}.review-comment-judgment"
title = "Judge pull-request comments without editing"
needs = ["{target}.inventory-artifacts"]
metadata = { "gc.run_target" = "contributor.d2b-pr-comment-judge" }
description_file = "../assets/workflows/d2b-compound-resolution/{target}.review-comment-judgment.md"

[[template]]
id = "{target}.apply-comment-fixes"
title = "Apply accepted pull-request comment fixes through native ce-work"
needs = ["{target}.review-comment-judgment"]
metadata = { "gc.run_target" = "compound-engineering.ce-work", "gc.continuation_group" = "d2b-comment-resolution-fixes" }
description_file = "../assets/workflows/d2b-compound-resolution/{target}.apply-comment-fixes.md"

[[template]]
id = "{target}.verify-comment-resolution"
title = "Re-verify pull-request comment fixes without editing"
needs = ["{target}.apply-comment-fixes"]
metadata = { "gc.run_target" = "contributor.d2b-pr-comment-verifier" }
description_file = "../assets/workflows/d2b-compound-resolution/{target}.verify-comment-resolution.md"

[[template]]
id = "{target}.synthesize-resolution"
title = "Synthesize native Compound Engineering resolution"
needs = ["{target}.verify-comment-resolution"]
metadata = { "gc.run_target" = "compound-engineering.ce-compound" }
description_file = "../assets/workflows/d2b-compound-resolution/{target}.synthesize-resolution.md"

[[template]]
id = "{target}"
title = "Finalize separated Compound Engineering resolution"
needs = ["{target}.synthesize-resolution"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.build.artifact_schema" = "gc.build.final-report.v1", "gc.build.artifact_path_keys" = "gc.build.final_report_path", "gc.build.terminal_state_writer" = "service-activation.py write-terminal-state" }
description_file = "../assets/workflows/d2b-compound-resolution/{target}.md"

[template.check]
max_attempts = 3

[template.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
