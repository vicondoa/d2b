# Immutable Gas City contributor city.
#
# The four city imports are deliberate peers.  The Compound pack keeps its own
# ../gascity dependency, so the Nix asset builder places the upstream trees
# beside one another instead of copying one pack into another.  Gas City roles
# are separately rig-scoped below, as required by the upstream pack contract.

[workspace]
name = "d2b-contributor"
provider = "copilot-code-luna"
max_active_sessions = 2
global_fragments = ["d2b-managed-contributor"]

[session]
# Control-plane, dispatcher, and non-model helper processes use the headless
# local runtime.  Model-backed agents opt into ACP below.
provider = "subprocess"

[imports.gc]
source = "../packs/gascity"

[imports.compound-engineering]
source = "../packs/compound-engineering"

[imports.discord]
source = "../packs/discord"

[imports.contributor]
source = "../pack"

[[rigs]]
name = "d2b"
path = "/var/lib/gascity-contributor/state/rigs/d2b"

[rigs.imports.gc]
source = "../packs/gascity/roles"

# These provider presets are the only Copilot launch surface used by the
# generated role bindings.  Model and context selection is supplied by the
# immutable profile homes owned by the ACP launcher; the role matrix records
# the effective profile expected at readiness.

[providers.copilot-planning-sol]
base = "builtin:copilot"
command = "exec python3 \"$GC_CONTRIBUTOR_ROOT/pack/scripts/copilot-profile.py\""
acp_command = "exec python3 \"$GC_CONTRIBUTOR_ROOT/pack/scripts/copilot-profile.py\""
path_check = "python3"
args = []
supports_acp = true
acp_args = [
  "--profile", "review-sol",
  "--tool-policy", "planning",
]
env = { COPILOT_CUSTOM_INSTRUCTIONS_DIRS = "" }

[providers.copilot-review-sol]
base = "builtin:copilot"
command = "exec python3 \"$GC_CONTRIBUTOR_ROOT/pack/scripts/copilot-profile.py\""
acp_command = "exec python3 \"$GC_CONTRIBUTOR_ROOT/pack/scripts/copilot-profile.py\""
path_check = "python3"
args = []
supports_acp = true
acp_args = [
  "--profile", "review-sol",
  "--tool-policy", "review",
]
env = { COPILOT_CUSTOM_INSTRUCTIONS_DIRS = "" }

[providers.copilot-review-luna]
base = "builtin:copilot"
command = "exec python3 \"$GC_CONTRIBUTOR_ROOT/pack/scripts/copilot-profile.py\""
acp_command = "exec python3 \"$GC_CONTRIBUTOR_ROOT/pack/scripts/copilot-profile.py\""
path_check = "python3"
args = []
supports_acp = true
acp_args = [
  "--profile", "review-luna",
  "--tool-policy", "review",
]
env = { COPILOT_CUSTOM_INSTRUCTIONS_DIRS = "" }

[providers.copilot-code-luna]
base = "builtin:copilot"
command = "exec python3 \"$GC_CONTRIBUTOR_ROOT/pack/scripts/copilot-profile.py\""
acp_command = "exec python3 \"$GC_CONTRIBUTOR_ROOT/pack/scripts/copilot-profile.py\""
path_check = "python3"
args = []
supports_acp = true
acp_args = [
  "--profile", "code-luna",
  "--tool-policy", "coding",
]
env = { COPILOT_CUSTOM_INSTRUCTIONS_DIRS = "" }

# The following assignments are generated from city/agent-role-matrix.toml.
# Keep this block mechanically boring: one imported agent, one provider, and
# one ACP transport per model-backed role.  In particular, do not replace a
# provider with an implicit selector or add an implicit fallback.

[[patches.agent]]
dir = "d2b"
name = "gc.requirements-planner"
provider = "copilot-planning-sol"
session = "acp"

