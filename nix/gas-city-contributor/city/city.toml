# Immutable Gas City contributor city.
#
# The four imports are deliberate peer imports.  The Compound pack keeps its
# own ../gascity dependency, so the Nix asset builder places the upstream
# trees beside one another instead of copying one pack into another.

[workspace]
name = "d2b-contributor"
provider = "copilot-coding"
max_active_sessions = 2
global_fragments = ["d2b-managed-contributor"]

[session]
# Control-plane, dispatcher, and non-model helper processes use the headless
# local runtime.  Model-backed agents opt into ACP below.
provider = "subprocess"

[imports.gc]
source = "../packs/gascity"

[imports.compound-engineering]
source = "../packs/compound-engineering"

[imports.discord]
source = "../packs/discord"

[imports.contributor]
source = "../pack"

# These provider presets are the only Copilot launch surface used by the
# generated role bindings.  Model and context selection is supplied by the
# immutable profile homes owned by the ACP launcher; the role matrix records
# the effective profile expected at readiness.

[providers.copilot-planning]
base = "builtin:copilot"
command = "copilot"
acp_command = "copilot"
args = []
supports_acp = true
acp_args = [
  "--acp",
  "--no-custom-instructions",
  "--no-auto-update",
  "--disable-builtin-mcps",
  "--no-remote",
  "--no-remote-export",
  "--available-tools", "view,search,apply_patch",
  "--deny-tool", "shell(gh)",
  "--deny-tool", "shell(gh *)",
  "--deny-tool", "shell(git push)",
  "--deny-tool", "shell(git push *)",
  "--deny-tool", "shell(discord)",
  "--deny-tool", "shell(discord *)",
]
env = { COPILOT_HOME = "${GC_COPILOT_HOME}", COPILOT_CUSTOM_INSTRUCTIONS_DIRS = "" }

[providers.copilot-review]
base = "builtin:copilot"
command = "copilot"
acp_command = "copilot"
args = []
supports_acp = true
acp_args = [
  "--acp",
  "--no-custom-instructions",
  "--no-auto-update",
  "--disable-builtin-mcps",
  "--no-remote",
  "--no-remote-export",
  "--available-tools", "view,search",
  "--deny-tool", "shell(gh)",
  "--deny-tool", "shell(gh *)",
  "--deny-tool", "shell(git push)",
  "--deny-tool", "shell(git push *)",
  "--deny-tool", "shell(discord)",
  "--deny-tool", "shell(discord *)",
]
env = { COPILOT_HOME = "${GC_COPILOT_HOME}", COPILOT_CUSTOM_INSTRUCTIONS_DIRS = "" }

[providers.copilot-review-fallback]
base = "builtin:copilot"
command = "copilot"
acp_command = "copilot"
args = []
supports_acp = true
acp_args = [
  "--acp",
  "--no-custom-instructions",
  "--no-auto-update",
  "--disable-builtin-mcps",
  "--no-remote",
  "--no-remote-export",
  "--available-tools", "view,search",
  "--deny-tool", "shell(gh)",
  "--deny-tool", "shell(gh *)",
  "--deny-tool", "shell(git push)",
  "--deny-tool", "shell(git push *)",
  "--deny-tool", "shell(discord)",
  "--deny-tool", "shell(discord *)",
]
env = { COPILOT_HOME = "${GC_COPILOT_HOME}", COPILOT_CUSTOM_INSTRUCTIONS_DIRS = "" }

[providers.copilot-coding]
base = "builtin:copilot"
command = "copilot"
acp_command = "copilot"
args = []
supports_acp = true
acp_args = [
  "--acp",
  "--no-custom-instructions",
  "--no-auto-update",
  "--disable-builtin-mcps",
  "--no-remote",
  "--no-remote-export",
  "--available-tools", "bash,view,search,apply_patch",
  "--deny-tool", "shell(gh)",
  "--deny-tool", "shell(gh *)",
  "--deny-tool", "shell(git push)",
  "--deny-tool", "shell(git push *)",
  "--deny-tool", "shell(discord)",
  "--deny-tool", "shell(discord *)",
]
env = { COPILOT_HOME = "${GC_COPILOT_HOME}", COPILOT_CUSTOM_INSTRUCTIONS_DIRS = "" }

