# Source of truth for model-backed role bindings.
#
# A role occurs exactly once below.  The city generator consumes these rows
# when emitting the sanitized provider/session assignments.  Control helpers
# (gc.run-operator and gc.publisher) intentionally do not occur here: they are
# deterministic non-model subprocess helpers and inherit the city session
# runtime.

schema = 1
city_session = "subprocess"

[profiles.planning]
provider = "copilot-planning"
session = "acp"
model = "gpt-5.6-sol"
context = "long_context"
effort = "xhigh"
fallback = "none"
tool_policy = "planning-artifacts"

[profiles.review]
provider = "copilot-review"
session = "acp"
model = "gpt-5.6-sol"
context = "long_context"
effort = "xhigh"
fallback = "copilot-review-fallback"
tool_policy = "read-only-review"

[profiles.coding]
provider = "copilot-coding"
session = "acp"
model = "gpt-5.6-luna"
context = "default"
effort = "max"
fallback = "none"
tool_policy = "worktree-edit-check"

[profiles.review-fallback]
provider = "copilot-review-fallback"
session = "acp"
model = "gpt-5.6-luna"
context = "long_context"
effort = "max"
fallback = "none"
tool_policy = "read-only-review"

