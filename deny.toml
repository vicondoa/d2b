[bans]
multiple-versions = "warn"
wildcards = "deny"
# Accepted duplicate clusters (rust-skills audit RS-0946/RS-0947/RS-0949,
# reviewed 2026-09-25). cargo-deny reports these on every run; each entry
# names the versions, the pullers, and the re-check trigger. The clusters
# below are accepted because the pullers' version ranges genuinely do not
# unify (no lower-bound raise reaches both legs). multiple-versions stays
# "warn" until the workspace-direct clusters resolve; a warn-to-deny flip
# that fails on these known clusters is an expected cost, not a mystery.
#
# nix (three legs): 0.26.4 pulled by ttrpc 0.9.0 (ttrpc's own pin);
# 0.29.0 is the workspace pin, pulled by 17 workspace members (d2b,
# d2b-broker, d2b-core, d2b-host, d2b-provider-audio-pipewire,
# d2b-provider-clipboard-wayland, d2b-provider-device-security-key,
# d2b-provider-device-tpm, d2b-provider-display-wayland, d2b-provider-host,
# d2b-provider-user, d2b-provider-volume-local, d2b-session-unix,
# d2b-unsafe-local-helper, d2bd, d2bd-runtime, xtask); 0.31.3 pulled by
# command-fds 0.3.3 and vsock 0.5.4 (via d2b-provider-transport-vsock).
# Keep the workspace pin at 0.29. Re-check when ttrpc or vsock bumps its
# nix pin.
#
# rustix (two majors): 0.38.44 is the workspace pin, pulled by 23
# workspace/transitive dependents (d2b, d2b-audit, d2b-broker,
# d2b-contracts-broker, d2b-core, d2b-host, d2b-provider-clipboard-wayland,
# d2b-provider-config-nixos, d2b-provider-display-wayland,
# d2b-provider-network-local, d2b-provider-observability-otel,
# d2b-provider-process, d2b-provider-supervisor,
# d2b-provider-transport-unix, d2b-provider-volume-local,
# d2b-resource-compiler, d2b-session-unix, d2b-sk-frontend,
# d2b-unsafe-local-helper, d2bd, d2bd-runtime, which, xtask); 1.1.4 pulled
# transitively by the async-std/wayland/tempfile/zbus families (async-io,
# async-process, async-signal, polling, tempfile, wayland-backend,
# wayland-client, zbus). Migrating the workspace pin to 1.1 needs a
# dedicated feature-surface pass. Re-check at each dependency refresh.
#
# Transitive-only clusters (the remainder; none workspace-direct):
#   bitflags 1.3.2 (defmt, nix) / 2.13.1 (rustix, wayland-client, rusqlite,
#     objc2 families, nix)
#   getrandom 0.2.17 (ring, d2bd, d2bd-runtime, rand_core) / 0.3.4 (snow,
#     d2b-bus, d2b-provider-transport-unix) / 0.4.3 (tempfile, uuid, jobserver)
#   hashbrown 0.12.3 (indexmap 1.x) / 0.14.5 (dashmap) / 0.16.1 (rsqlite-vfs)
#     / 0.17.1 (indexmap 2.x, hashlink)
#   heck 0.3.3 (prost-build) / 0.5.0 (clap_derive, strum_macros)
#   indexmap 1.9.3 (envmnt, petgraph) / 2.14.0 (protobuf-parse, toml_edit)
#   linux-raw-sys 0.4.15 (rustix 0.38) / 0.12.1 (rustix 1.1)
#   memoffset 0.7.1 (nix 0.26) / 0.9.1 (nix 0.29/0.31, uds_windows)
#   phf family 0.11.3 (web_atoms, string_cache, phf_codegen,
#     string_cache_codegen) / 0.13.1 (wl-proxy, phf_macros)
#   proc-macro-crate 1.3.1 (bolero-generator-derive) / 3.5.0 (zbus_macros,
#     zvariant_derive)
#   r-efi 5.3.0 / 6.0.0 (getrandom 0.3/0.4 legs)
#   rand 0.8.7 (bolero, bolero-engine, tungstenite, phf_generator) /
#     0.9.5 + 0.10.2 (linearize)
#   rand_core 0.6.4 (rand 0.8, rand_chacha, crypto-common,
#     bolero-generator) / 0.9.5 + 0.10.1 (rand 0.9/0.10)
#   socket2 0.5.10 (d2b-contracts-broker, d2b-provider-network-local,
#     d2b-unsafe-local-helper, d2bd, d2bd-runtime) / 0.6.5 (tokio)
#   syn 1.0.109 (prost-derive, bolero-generator-derive, derive-new,
#     uapi-proc) / 2.0.119 (20 macro crates incl. thiserror-impl,
#     schemars_derive, strum_macros, zerocopy-derive) / 3.0.3 (14 macro
#     crates incl. serde_derive, clap_derive, async-trait, tokio-macros,
#     zbus_macros)
#   thiserror 1.0.69 (ttrpc, protobuf 3.7.2 family, tungstenite 0.24) /
#     2.0.20 (workspace decls + wl-proxy, command-fds, html2text)
#   toml_datetime 0.6.11 / 1.1.1 (toml_edit 0.19 vs 0.25 legs)
#   toml_edit 0.19.15 / 0.25.13 (proc-macro-crate 1.3 vs 3.5 legs)
#   winnow 0.5.40 (toml_edit 0.19) / 1.0.4 (toml_edit 0.25, zbus family,
#     toml_parser)
#   windows-link 0.1.3 (windows 0.61 family) / 0.2.1 (backtrace,
#     parking_lot_core, windows-sys 0.61)
#   windows-sys 0.48.0 (ttrpc) / 0.52.0 (ring, socket2) / 0.59.0
#     (rustix 0.38) / 0.61.2 (tokio, mio, polling, tempfile, errno, zbus,
#     nu-ansi-term, anstyle family, home, uds_windows, rustix 1.1)
#   windows-targets + 8 windows_* platform-tier crates: 0.48.5 / 0.52.6
#     (windows-sys 0.48/0.52/0.59 legs)
# Re-check the whole inventory at each lock regeneration; the clusters are
# transitive-only and follow their pullers' ranges.

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/vicondoa/wl-proxy.git"]
