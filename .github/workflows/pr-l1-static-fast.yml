name: pr-l1-static-fast
on:
  workflow_dispatch:
  pull_request:
    branches: [main, v3]
  push:
    branches: [main, v3]

permissions:
  contents: read

env:
  BAZEL_SH: /bin/bash

defaults:
  run:
    shell: sh tests/tools/ci-shell {0}

jobs:
  tier0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Bazel repository fetches (rules_rs, rules_nixpkgs, jq.bzl, rules_buf,
      # rules_llvm kernel headers, rust-redist, ...) download third-party
      # release artifacts during analysis. A transient HTTP 5xx from the
      # release host aborts analysis and, with it, the whole job; a bounded
      # retry of the fetch/analysis phase lets the second or third attempt
      # succeed. Only Bazel's own `GET returned 5xx` download-failure line
      # triggers a retry: a 404, a hash mismatch, a compile error, or a test
      # failure still fails the job on the first attempt.
      - name: Fixed Bazel preflight
        env:
          D2B_CI_FETCH_RETRY_CMD: make check-tier0
        run: &bazel-fetch-retry |
          set -eu
          cmd=${D2B_CI_FETCH_RETRY_CMD:?}
          unset D2B_CI_FETCH_RETRY_CMD
          attempts=3
          attempt=1
          while :; do
            log=$(mktemp)
            set +e
            bash -c "$cmd" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              rm -f "$log"
              exit 0
            fi
            if ! grep -Eq 'GET returned 5[0-9][0-9]' "$log"; then
              rm -f "$log"
              exit "$status"
            fi
            rm -f "$log"
            if [ "$attempt" -ge "$attempts" ]; then
              echo "::error::Bazel download failed with a transient HTTP 5xx after $attempts attempts" >&2
              exit "$status"
            fi
            echo "::warning::Transient Bazel download error (HTTP 5xx); retrying attempt $((attempt + 1))/$attempts" >&2
            sleep 15
            attempt=$((attempt + 1))
          done

  policy-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Policy and tooling suite
        env:
          D2B_CI_FETCH_RETRY_CMD: make test-policy
        run: *bazel-fetch-retry

  rust-main:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
      D2B_BAZEL_LOCAL_TEST_JOBS: "1"
      D2B_BAZEL_JOBS: "8"
      D2B_BAZEL_TEST_OUTPUT: "all"
      D2B_BAZEL_TEST_TAG_FILTERS: "-local,-manual,-exclusive,-gpu,-kvm"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Portable Rust main suite
        env:
          D2B_CI_FETCH_RETRY_CMD: make test-rust-main
        run: *bazel-fetch-retry

  rust-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Broker suite
        env:
          D2B_CI_FETCH_RETRY_CMD: make test-rust-broker
        run: *bazel-fetch-retry

  nix-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Nix evaluation suite
        env:
          D2B_CI_FETCH_RETRY_CMD: make test-flake
        run: *bazel-fetch-retry

  nix-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Nix surface suite
        env:
          D2B_CI_FETCH_RETRY_CMD: make test-nix-unit
        run: *bazel-fetch-retry

  nix-realized:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Realized Nix suite
        env:
          D2B_CI_FETCH_RETRY_CMD: make test-flake-realized
        run: *bazel-fetch-retry

  nix-aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: AArch64 Nix smoke suite
        env:
          D2B_CI_FETCH_RETRY_CMD: make test-flake-aarch64
        run: *bazel-fetch-retry

  fixtures-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Fixtures and proofs suite
        env:
          D2B_CI_FETCH_RETRY_CMD: make test-fixture-contracts
        run: *bazel-fetch-retry

  census:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Blocking-API census cap
        env:
          D2B_CI_FETCH_RETRY_CMD: make check-census
        run: *bazel-fetch-retry

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Identifier-in-log redaction scan
        env:
          D2B_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tests/tools/security-scan.sh

  test-performance-budgets:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Advisory performance gate
        run: make test-performance-budgets

  check:
    if: ${{ always() }}
    needs: [tier0, policy-tooling, rust-main, rust-broker, nix-eval, nix-unit, nix-realized, nix-aarch64, fixtures-proofs, census, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Fixed Layer-1 suites passed
        env:
          SUITES_OK: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: test "$SUITES_OK" = true
