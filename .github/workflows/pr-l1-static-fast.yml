name: pr-l1-static-fast
on:
  pull_request:
    branches: [main, v3]
  push:
    branches: [main, v3]

permissions:
  contents: read

env:
  BAZEL_SH: /bin/bash

defaults:
  run:
    shell: sh tests/tools/ci-shell {0}

jobs:
  tier0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Fixed Bazel preflight
        run: nix develop --no-write-lock-file .#bazel -c make check-tier0

  policy-tooling:
    needs: [tier0]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Policy and tooling suite
        run: nix develop --no-write-lock-file .#bazel -c make test-policy

  rust-main:
    needs: [tier0]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
      D2B_BAZEL_TEST_TAG_FILTERS: "-local,-manual,-exclusive,-gpu,-kvm"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Portable Rust main suite
        run: nix develop --no-write-lock-file .#bazel -c make test-rust-main

  rust-broker:
    needs: [tier0]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Broker suite
        run: nix develop --no-write-lock-file .#bazel -c make test-rust-broker

  rust-guest:
    needs: [tier0]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Guest shell runner suite
        run: nix develop --no-write-lock-file .#bazel -c make test-rust-guest-shell-runner

  rust-local:
    needs: [tier0]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Local Rust suite
        run: nix develop --no-write-lock-file .#bazel -c make test-rust-local

  nix-eval:
    needs: [tier0]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Nix evaluation suite
        run: nix develop --no-write-lock-file .#bazel -c make test-flake

  nix-realized:
    needs: [tier0]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Realized Nix suite
        run: nix develop --no-write-lock-file .#bazel -c make test-flake-realized

  nix-aarch64:
    needs: [tier0]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: AArch64 Nix smoke suite
        run: nix develop --no-write-lock-file .#bazel -c make test-flake-aarch64

  fixtures-proofs:
    needs: [tier0]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Fixtures and proofs suite
        run: nix develop --no-write-lock-file .#bazel -c make test-fixture-contracts

  test-performance-budgets:
    needs: [tier0]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    env:
      D2B_BAZEL_PROFILE: local
      D2B_BAZEL_UNTRUSTED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Advisory performance gate
        run: nix develop --no-write-lock-file .#bazel -c make test-performance-budgets

  check:
    if: ${{ always() }}
    needs: [tier0, policy-tooling, rust-main, rust-broker, rust-guest, rust-local, nix-eval, nix-realized, nix-aarch64, fixtures-proofs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Fixed Layer-1 suites passed
        env:
          SUITES_OK: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: test "$SUITES_OK" = true
