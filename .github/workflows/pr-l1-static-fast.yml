          path: trusted
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.merge_commit_sha }}
