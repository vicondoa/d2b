  check:
    needs: [tier0, check-inventory, test-performance-budgets, test-lint, test-changelog, test-rust, test-fixture-contracts, test-proofs, test-nix-unit, test-flake-x86, test-flake-aarch64, test-drift, test-policy, test-runtime-ledger]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Require generated Layer-1 gate graph to pass
        run: |
          failed=0
          require_success() {
            name="$1"
            result="$2"
            echo "$name=$result"
            if [ "$result" != success ]; then
              echo "::error::$name did not pass (result=$result)"
              failed=1
            fi
          }
          allow_success_or_skipped() {
            name="$1"
            result="$2"
            echo "$name=$result"
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "::error::$name did not pass (result=$result)"
              failed=1
            fi
          }
          require_advisory_success() {
            name="$1"
            result="$2"
            echo "advisory:$name=$result (not an enforcing pass)"
            if [ "$result" != success ]; then
              echo "::error::required advisory $name did not complete successfully (result=$result)"
              failed=1
            fi
          }
          require_success tier0 '${{ needs.tier0.result }}'
          require_success check-inventory '${{ needs.check-inventory.result }}'
          require_advisory_success test-performance-budgets '${{ needs.test-performance-budgets.result }}'
          require_success test-lint '${{ needs.test-lint.result }}'
          allow_success_or_skipped test-changelog '${{ needs.test-changelog.result }}'
          require_success test-rust '${{ needs.test-rust.result }}'
          require_success test-fixture-contracts '${{ needs.test-fixture-contracts.result }}'
          require_success test-proofs '${{ needs.test-proofs.result }}'
          require_success test-nix-unit '${{ needs.test-nix-unit.result }}'
          require_success test-flake-x86 '${{ needs.test-flake-x86.result }}'
          require_success test-flake-aarch64 '${{ needs.test-flake-aarch64.result }}'
          require_success test-drift '${{ needs.test-drift.result }}'
          require_success test-policy '${{ needs.test-policy.result }}'
          require_success test-runtime-ledger '${{ needs.test-runtime-ledger.result }}'
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All generated enforcing Layer-1 jobs passed."
          echo "Required advisory jobs completed (not enforcing passes): test-performance-budgets"
