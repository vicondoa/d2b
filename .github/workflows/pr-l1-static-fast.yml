# This file is generated by `make layer1-workflow`.
# Source of truth: tests/layer1-jobs.json and tests/ci/layer1-workflow.template.yml.
# Do not edit .github/workflows/pr-l1-static-fast.yml directly.
name: pr-l1-static-fast
on:
  pull_request:
    branches: [main, v3]
  push:
    branches: [main, v3]

permissions:
  contents: read

defaults:
  run:
    shell: sh tests/tools/ci-shell {0}

jobs:
  tier0:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Tier 0 first-pass gate
        run: make check-tier0
      - name: ADR index coverage guard
        run: make test-adr-index-coverage
      - name: CI coverage structural guard
        run: make test-ci-coverage

  check-inventory:
    needs: [tier0]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Migration ledger drift gate
        run: make check-inventory

  test-performance-budgets:
    name: "Advisory - non-enforcing - Performance budget gate"
    needs: [tier0]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Performance budget gate
        run: make test-performance-budgets

  test-lint:
    needs: [tier0]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Nix store cache
        # Without this every nix job rebuilds the Rust host-tool set from
        # source, which is what makes the fixture-contract gate cost half an
        # hour here while completing in seconds on a host with a substituter.
        # Restore is best-effort: a cache miss is slow, never incorrect.
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'packages/Cargo.lock', 'packages/rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: Lint gate (preflight + parse + shellcheck)
        run: make test-lint

  test-changelog:
    if: github.event_name == 'pull_request'
    needs: [tier0]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Changelog policy gate
        run: make test-changelog

  test-rust:
    needs: [tier0]
    runs-on: ubuntu-latest
    # Warm (rust-cache hit): ~8-12 min. Cold (no cache): ~43 min.
    timeout-minutes: 60
    env:
      # CI relies on Swatinem/rust-cache (target-dir caching) rather than
      # sccache, which caches ALL compiled artifacts including proc-macros and
      # bin/lib crates. sccache is simply not installed on the runner, and the
      # cargo configs route rustc through .cargo/rustc-wrapper.sh, which falls
      # through to plain rustc when sccache is absent - so no override is
      # needed to keep cargo working here.
      #
      # CARGO_INCREMENTAL=0 is still set: incremental compilation artifacts are
      # non-deterministic and bloat the cache without benefit for CI (each PR
      # run starts from a different commit).
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@23cf0fec1d55e0b1f2631aedd2a610c21ef8b077
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Nix store cache
        # Without this every nix job rebuilds the Rust host-tool set from
        # source, which is what makes the fixture-contract gate cost half an
        # hour here while completing in seconds on a host with a substituter.
        # Restore is best-effort: a cache miss is slow, never incorrect.
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'packages/Cargo.lock', 'packages/rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: Free runner disk for Rust gate
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h
      - name: Install pinned Rust toolchain + ripgrep + acl
        # MUST run BEFORE Swatinem/rust-cache: the cache action reads
        # `rustc --version` to compute its key hash, so the pinned
        # toolchain must be the active default when the cache step runs.
        # Without this, the runner's pre-installed 1.96.0 is hashed,
        # and the cache is keyed on the wrong compiler version.
        run: |
          PINNED=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' packages/rust-toolchain.toml | head -1)
          rustup toolchain install "$PINNED" --profile minimal --component rustfmt --component clippy
          rustup default "$PINNED"
          echo "Rust toolchain: $(rustc --version)"
          sudo apt-get update && sudo apt-get install -y ripgrep acl
      - name: Rust dependency cache (target dirs + cargo registry)
        # Swatinem/rust-cache caches dependency artifacts in target dirs
        # and the cargo registry. It performs all I/O in its own action
        # process (JavaScript pre/post steps) via @actions/cache - no
        # ACTIONS_RUNTIME_TOKEN or cache credentials are exposed to `run:`
        # steps where untrusted crate code (build scripts, proc-macros,
        # `cargo test`) executes.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            packages -> target
            packages/d2b-priv-broker -> target
            packages/d2b-guest-shell-runner -> target
          cache-directories: |
            packages/d2b-priv-broker/target-layer1
            packages/d2b-priv-broker/target-fakebackends
            tests/tools/no-bash-ast-walker/target
          prefix-key: "v0-rust"
          shared-key: "test-rust-${{ runner.os }}"
          save-if: "true"
      - name: Rust workspace gate
        env:
          D2B_SKIP_FIXTURE_BUILD: "1"
        run: make test-rust

