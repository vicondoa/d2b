name: pr-eval-shell-tests
on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]

permissions:
  contents: read

defaults:
  run:
    shell: sh tests/tools/ci-shell {0}

jobs:
  eval-shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Fixed Bazel policy checks
        run: |
          set -euo pipefail
          make check-tier0
          make test-policy
          make test-drift
