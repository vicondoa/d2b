name: release-host-binaries
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish
        required: true
        type: string
      merged_v3_head:
        description: Current merged v3 HEAD commit
        required: true
        type: string
      sealed_tree:
        description: Sealed release tree object
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: sh tests/tools/ci-shell {0}

jobs:
  prepublication-identity:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.identity.outputs.version }}
      merged_v3_head: ${{ steps.identity.outputs.merged_v3_head }}
      sealed_tree: ${{ steps.identity.outputs.sealed_tree }}
      v3_tree: ${{ steps.identity.outputs.v3_tree }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: v3
          fetch-depth: 0
      - id: identity
        name: Validate publication identity
        env:
          VERSION: ${{ inputs.version }}
          MERGED_V3_HEAD: ${{ inputs.merged_v3_head }}
          SEALED_TREE: ${{ inputs.sealed_tree }}
        run: |
          # shellcheck shell=bash
          # shellcheck disable=SC3011,SC3030,SC3040,SC3054
          set -euo pipefail

          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Publication blocked: manual version is not a semantic version." >&2
            exit 1
          }
          printf '%s' "$MERGED_V3_HEAD" | grep -Eq '^[0-9a-fA-F]{40}$' || {
            echo "Publication blocked: manual merged_v3_head is not a commit object id." >&2
            exit 1
          }
          printf '%s' "$SEALED_TREE" | grep -Eq '^[0-9a-fA-F]{40}$' || {
            echo "Publication blocked: manual sealed_tree is not a tree object id." >&2
            exit 1
          }
          MERGED_V3_HEAD=$(printf '%s' "$MERGED_V3_HEAD" | tr '[:upper:]' '[:lower:]')
          SEALED_TREE=$(printf '%s' "$SEALED_TREE" | tr '[:upper:]' '[:lower:]')

          git fetch origin v3 --no-tags --force
          trusted_checkout_head=$(git rev-parse HEAD)
          current_v3_head=$(git rev-parse refs/remotes/origin/v3)
          current_v3_tree=$(git rev-parse "$current_v3_head^{tree}")
          [ "$trusted_checkout_head" = "$current_v3_head" ] || {
            echo "Publication blocked: trusted v3 checkout is not the current v3 HEAD." >&2
            exit 1
          }
          git cat-file -e "$MERGED_V3_HEAD^{commit}"
          git cat-file -e "$SEALED_TREE^{tree}"
          [ "$MERGED_V3_HEAD" = "$current_v3_head" ] || {
            echo "Publication blocked: manual merged_v3_head is not the current v3 HEAD." >&2
            exit 1
          }
          [ "$SEALED_TREE" = "$current_v3_tree" ] || {
            echo "Publication blocked: current v3 HEAD does not have the sealed F8 tree." >&2
            exit 1
          }
          tag_name="v$VERSION"
          tag_ref="refs/tags/$tag_name"
          if git ls-remote --exit-code --refs origin "$tag_ref" >/dev/null 2>&1; then
            git fetch origin "$tag_ref:$tag_ref"
            tag_kind=$(git cat-file -t "$tag_ref" 2>/dev/null || true)
            tag_target=$(git rev-parse "$tag_ref^{commit}" 2>/dev/null || true)
            tag_header=$(git cat-file tag "$tag_ref" 2>/dev/null | sed -n 's/^tag //p' | head -1 || true)
            tag_subject=$(git for-each-ref --format='%(subject)' "$tag_ref" 2>/dev/null || true)
            if [ "$tag_kind" != "tag" ] \
              || [ "$tag_target" != "$current_v3_head" ] \
              || [ "$tag_header" != "$tag_name" ] \
              || [ "$tag_subject" != "$tag_name" ]; then
              echo "Publication blocked: existing release tag $tag_name conflicts with the validated merged HEAD or annotation." >&2
              exit 1
            fi
            echo "Existing annotated tag $tag_name matches the validated merged HEAD and annotation; adopting it."
          fi

          for manifest in \
            packages/d2bd/Cargo.toml \
            packages/d2b/Cargo.toml \
            packages/d2b-wayland-proxy/Cargo.toml \
            packages/d2b-unsafe-local-helper/Cargo.toml \
            packages/d2b-host/Cargo.toml \
            packages/d2b-priv-broker/Cargo.toml
          do
            package_version=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest" | head -1)
            [ "$package_version" = "$VERSION" ] || {
              echo "Publication blocked: $manifest is not version $VERSION." >&2
              exit 1
            }
          done
          grep -Eq "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
            echo "Publication blocked: CHANGELOG.md has no release section for $VERSION." >&2
            exit 1
          }

          flake_versions=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' flake.nix | sort -u)
          [ "$(printf '%s\n' "$flake_versions" | grep -c .)" -gt 0 ] \
            && [ "$(printf '%s\n' "$flake_versions" | awk -v expected="$VERSION" '$0 != expected && NF { count++ } END { print count + 0 }')" -eq 0 ] || {
            echo "Publication blocked: flake package versions do not match $VERSION." >&2
            exit 1
          }

          manifest_version=$(jq -r 'if .version == null then "null" else (.version | strings) end' nix/prebuilt.json)
          expected_keys='["d2b","d2b-activation-helper","d2b-priv-broker","d2b-unsafe-local-helper","d2b-wayland-proxy","d2bd"]'
          if [ "$manifest_version" = "null" ]; then
            jq -e '.version == null and .system == "x86_64-linux" and .binaries == {}' \
              nix/prebuilt.json >/dev/null || {
              echo "Publication blocked: nix/prebuilt.json is not the explicit source fallback." >&2
              exit 1
            }
          else
            [ "$manifest_version" = "$VERSION" ] || {
              echo "Publication blocked: nix/prebuilt.json does not match $VERSION." >&2
              exit 1
            }
            [ "$(jq -c '.binaries | keys' nix/prebuilt.json)" = "$expected_keys" ] || {
              echo "Publication blocked: nix/prebuilt.json does not enumerate the six release binaries." >&2
              exit 1
            }
            for binary in \
              d2b \
              d2b-activation-helper \
              d2b-priv-broker \
              d2b-unsafe-local-helper \
              d2b-wayland-proxy \
              d2bd
            do
              asset="${binary}-${VERSION}-x86_64-linux.tar.gz"
              url=$(jq -er --arg binary "$binary" '.binaries[$binary].url | strings' nix/prebuilt.json)
              hash=$(jq -er --arg binary "$binary" '.binaries[$binary].hash | strings' nix/prebuilt.json)
              case "$url" in
                *"/releases/download/v${VERSION}/${asset}") ;;
                *)
                  echo "Publication blocked: manifest URL for $binary has the wrong release identity." >&2
                  exit 1
                  ;;
              esac
              printf '%s' "$hash" | grep -Eq '^sha256-[A-Za-z0-9+/]+={0,2}$' || {
                echo "Publication blocked: manifest hash for $binary is not an SRI SHA-256." >&2
                exit 1
              }
            done
          fi

          {
            printf 'version=%s\n' "$VERSION"
            printf 'merged_v3_head=%s\n' "$current_v3_head"
            printf 'sealed_tree=%s\n' "$current_v3_tree"
            printf 'v3_tree=%s\n' "$current_v3_tree"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [prepublication-identity]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      GITHUB_TOKEN: ""
      ACTIONS_RUNTIME_TOKEN: ""
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ needs.prepublication-identity.outputs.merged_v3_head }}
          fetch-depth: 0
      - name: Verify selected merged tree before build
        env:
          VERSION: ${{ needs.prepublication-identity.outputs.version }}
          MERGED_V3_HEAD: ${{ needs.prepublication-identity.outputs.merged_v3_head }}
          SEALED_TREE: ${{ needs.prepublication-identity.outputs.sealed_tree }}
          CURRENT_V3_TREE: ${{ needs.prepublication-identity.outputs.v3_tree }}
        run: |
          # shellcheck shell=bash
          # shellcheck disable=SC3011,SC3030,SC3040,SC3054
          set -euo pipefail
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s' "$MERGED_V3_HEAD" | grep -Eq '^[0-9a-fA-F]{40}$'
          printf '%s' "$SEALED_TREE" | grep -Eq '^[0-9a-fA-F]{40}$'
          printf '%s' "$CURRENT_V3_TREE" | grep -Eq '^[0-9a-fA-F]{40}$'
          MERGED_V3_HEAD=$(printf '%s' "$MERGED_V3_HEAD" | tr '[:upper:]' '[:lower:]')
          SEALED_TREE=$(printf '%s' "$SEALED_TREE" | tr '[:upper:]' '[:lower:]')
          CURRENT_V3_TREE=$(printf '%s' "$CURRENT_V3_TREE" | tr '[:upper:]' '[:lower:]')
          git fetch origin v3 --no-tags --force
          [ "$(git rev-parse HEAD)" = "$MERGED_V3_HEAD" ] || {
            echo "Publication blocked: build checkout is not the selected merged v3 HEAD." >&2
            exit 1
          }
          [ "$(git rev-parse refs/remotes/origin/v3)" = "$MERGED_V3_HEAD" ] || {
            echo "Publication blocked: v3 moved after identity validation." >&2
            exit 1
          }
          [ "$SEALED_TREE" = "$CURRENT_V3_TREE" ] || {
            echo "Publication blocked: validated sealed tree differs from validated v3 tree." >&2
            exit 1
          }
          [ "$(git rev-parse "$MERGED_V3_HEAD^{tree}")" = "$SEALED_TREE" ] || {
            echo "Publication blocked: build checkout does not have the sealed F8 tree." >&2
            exit 1
          }
          git cat-file -e "$SEALED_TREE^{tree}"
          tag_name="v$VERSION"
          tag_ref="refs/tags/$tag_name"
          if git ls-remote --exit-code --refs origin "$tag_ref" >/dev/null 2>&1; then
            git fetch origin "$tag_ref:$tag_ref"
            tag_kind=$(git cat-file -t "$tag_ref" 2>/dev/null || true)
            tag_target=$(git rev-parse "$tag_ref^{commit}" 2>/dev/null || true)
            tag_header=$(git cat-file tag "$tag_ref" 2>/dev/null | sed -n 's/^tag //p' | head -1 || true)
            tag_subject=$(git for-each-ref --format='%(subject)' "$tag_ref" 2>/dev/null || true)
            if [ "$tag_kind" != "tag" ] \
              || [ "$tag_target" != "$MERGED_V3_HEAD" ] \
              || [ "$tag_header" != "$tag_name" ] \
              || [ "$tag_subject" != "$tag_name" ]; then
              echo "Publication blocked: existing release tag $tag_name conflicts with the validated merged HEAD or annotation." >&2
              exit 1
            fi
            echo "Existing annotated tag $tag_name matches the validated merged HEAD and annotation; adopting it."
          fi
          for manifest in \
            packages/d2bd/Cargo.toml \
            packages/d2b/Cargo.toml \
            packages/d2b-wayland-proxy/Cargo.toml \
            packages/d2b-unsafe-local-helper/Cargo.toml \
            packages/d2b-host/Cargo.toml \
            packages/d2b-priv-broker/Cargo.toml
          do
            package_version=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest" | head -1)
            [ "$package_version" = "$VERSION" ] || {
              echo "Publication blocked: $manifest is not version $VERSION." >&2
              exit 1
            }
          done
          grep -Eq "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          flake_versions=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' flake.nix | sort -u)
          [ "$(printf '%s\n' "$flake_versions" | awk -v expected="$VERSION" '$0 != expected && NF { count++ } END { print count + 0 }')" -eq 0 ]
          manifest_version=$(jq -r 'if .version == null then "null" else (.version | strings) end' nix/prebuilt.json)
          if [ "$manifest_version" = "null" ]; then
            jq -e '.version == null and .system == "x86_64-linux" and .binaries == {}' nix/prebuilt.json >/dev/null
          else
            [ "$manifest_version" = "$VERSION" ]
            [ "$(jq -r '.binaries | keys | length' nix/prebuilt.json)" -eq 6 ]
          fi
      - name: Activate pinned Rust toolchain
        run: |
          # shellcheck shell=bash
          # shellcheck disable=SC3011,SC3030,SC3040,SC3054
          set -euo pipefail
          PINNED=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' packages/rust-toolchain.toml | head -1)
          [ -n "$PINNED" ] || {
            echo "Publication blocked: packages/rust-toolchain.toml has no channel." >&2
            exit 1
          }
          rustup toolchain install "$PINNED" \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default "$PINNED"
      - name: Assert active Rust toolchain versions
        run: |
          # shellcheck shell=bash
          # shellcheck disable=SC3011,SC3030,SC3040,SC3054
          set -euo pipefail
          PINNED=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' packages/rust-toolchain.toml | head -1)
          active=$(rustup show active-toolchain | awk '{print $1}')
          case "$active" in
            "$PINNED"|"$PINNED"-*) ;;
            *)
              echo "Publication blocked: active Rust toolchain '$active' is not $PINNED." >&2
              exit 1
              ;;
          esac
          expected_cargo=$(rustup run "$PINNED" cargo --version)
          expected_rustc=$(rustup run "$PINNED" rustc --version)
          actual_cargo=$(cargo --version)
          actual_rustc=$(rustc --version)
          [ "$actual_cargo" = "$expected_cargo" ] || {
            echo "Publication blocked: cargo is not running from $PINNED." >&2
            exit 1
          }
          [ "$actual_rustc" = "$expected_rustc" ] || {
            echo "Publication blocked: rustc is not running from $PINNED." >&2
            exit 1
          }
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            packages -> target
            packages/d2b-priv-broker -> target
          cache-directories: |
            packages/d2b-priv-broker/target-layer1
            packages/d2b-priv-broker/target-fakebackends
          prefix-key: "v0-rust"
          shared-key: "release-${{ runner.os }}"
          save-if: "true"
      - name: Install ripgrep and acl
        run: sudo apt-get update && sudo apt-get install -y ripgrep acl
      - name: Build release binaries
        env:
          VERSION: ${{ needs.prepublication-identity.outputs.version }}
        run: |
          # shellcheck shell=bash
          # shellcheck disable=SC3011,SC3030,SC3040,SC3054
          set -euo pipefail
          PINNED=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' packages/rust-toolchain.toml | head -1)
          [ -n "$PINNED" ] || {
            echo "Publication blocked: packages/rust-toolchain.toml has no channel." >&2
            exit 1
          }
          rustup run "$PINNED" cargo build --release --locked --manifest-path packages/Cargo.toml \
            --package d2bd --bin d2bd
          rustup run "$PINNED" cargo build --release --locked --manifest-path packages/Cargo.toml \
            --package d2b --bin d2b
          rustup run "$PINNED" cargo build --release --locked --manifest-path packages/Cargo.toml \
            --package d2b-wayland-proxy --bin d2b-wayland-proxy
          rustup run "$PINNED" cargo build --release --locked --manifest-path packages/Cargo.toml \
            --package d2b-unsafe-local-helper --bin d2b-unsafe-local-helper
          rustup run "$PINNED" cargo build --release --locked --manifest-path packages/Cargo.toml \
            --package d2b-host --bin d2b-activation-helper
          rustup run "$PINNED" cargo build --release --locked \
            --manifest-path packages/d2b-priv-broker/Cargo.toml \
            --package d2b-priv-broker --bin d2b-priv-broker --no-default-features

          rm -rf dist
          mkdir -p dist/bin
          cp packages/target/release/d2bd dist/bin/
          cp packages/target/release/d2b dist/bin/
          cp packages/target/release/d2b-wayland-proxy dist/bin/
          cp packages/target/release/d2b-unsafe-local-helper dist/bin/
          cp packages/target/release/d2b-activation-helper dist/bin/
          cp packages/d2b-priv-broker/target/release/d2b-priv-broker dist/bin/

          for binary in \
            d2b \
            d2b-activation-helper \
            d2b-priv-broker \
            d2b-unsafe-local-helper \
            d2b-wayland-proxy \
            d2bd
          do
            [ -x "dist/bin/$binary" ] || {
              echo "Publication blocked: expected binary $binary was not built." >&2
              exit 1
            }
            tar -C dist/bin -czf "dist/${binary}-${VERSION}-x86_64-linux.tar.gz" "$binary"
            [ "$(tar -tzf "dist/${binary}-${VERSION}-x86_64-linux.tar.gz" | sed '/^$/d')" = "$binary" ] || {
              echo "Publication blocked: archive identity for $binary is invalid." >&2
              exit 1
            }
          done
          (
            cd dist
            sha256sum ./*.tar.gz > SHA256SUMS
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-binaries-${{ needs.prepublication-identity.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: [prepublication-identity, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ needs.prepublication-identity.outputs.merged_v3_head }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: host-binaries-${{ needs.prepublication-identity.outputs.version }}
          path: dist
      - name: Install Nix for artifact identity checks
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87e
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Verify release identity and artifacts
        env:
          VERSION: ${{ needs.prepublication-identity.outputs.version }}
          MERGED_V3_HEAD: ${{ needs.prepublication-identity.outputs.merged_v3_head }}
          SEALED_TREE: ${{ needs.prepublication-identity.outputs.sealed_tree }}
          CURRENT_V3_TREE: ${{ needs.prepublication-identity.outputs.v3_tree }}
        run: |
          # shellcheck shell=bash
          # shellcheck disable=SC3011,SC3030,SC3040,SC3054
          set -euo pipefail
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s' "$MERGED_V3_HEAD" | grep -Eq '^[0-9a-fA-F]{40}$'
          printf '%s' "$SEALED_TREE" | grep -Eq '^[0-9a-fA-F]{40}$'
          printf '%s' "$CURRENT_V3_TREE" | grep -Eq '^[0-9a-fA-F]{40}$'
          MERGED_V3_HEAD=$(printf '%s' "$MERGED_V3_HEAD" | tr '[:upper:]' '[:lower:]')
          SEALED_TREE=$(printf '%s' "$SEALED_TREE" | tr '[:upper:]' '[:lower:]')
          CURRENT_V3_TREE=$(printf '%s' "$CURRENT_V3_TREE" | tr '[:upper:]' '[:lower:]')
          git fetch origin v3 --no-tags --force
          [ "$(git rev-parse HEAD)" = "$MERGED_V3_HEAD" ] || {
            echo "Publication blocked: release checkout is not the selected merged v3 HEAD." >&2
            exit 1
          }
          [ "$(git rev-parse refs/remotes/origin/v3)" = "$MERGED_V3_HEAD" ] || {
            echo "Publication blocked: v3 moved after artifact creation." >&2
            exit 1
          }
          [ "$SEALED_TREE" = "$CURRENT_V3_TREE" ] || {
            echo "Publication blocked: validated sealed tree differs from validated v3 tree." >&2
            exit 1
          }
          [ "$(git rev-parse "$MERGED_V3_HEAD^{tree}")" = "$SEALED_TREE" ] || {
            echo "Publication blocked: release checkout does not have the sealed F8 tree." >&2
            exit 1
          }
          git cat-file -e "$SEALED_TREE^{tree}"
          tag_name="v$VERSION"
          tag_ref="refs/tags/$tag_name"
          if git ls-remote --exit-code --refs origin "$tag_ref" >/dev/null 2>&1; then
            git fetch origin "$tag_ref:$tag_ref"
            tag_kind=$(git cat-file -t "$tag_ref" 2>/dev/null || true)
            tag_target=$(git rev-parse "$tag_ref^{commit}" 2>/dev/null || true)
            tag_header=$(git cat-file tag "$tag_ref" 2>/dev/null | sed -n 's/^tag //p' | head -1 || true)
            tag_subject=$(git for-each-ref --format='%(subject)' "$tag_ref" 2>/dev/null || true)
            if [ "$tag_kind" != "tag" ] \
              || [ "$tag_target" != "$MERGED_V3_HEAD" ] \
              || [ "$tag_header" != "$tag_name" ] \
              || [ "$tag_subject" != "$tag_name" ]; then
              echo "Publication blocked: existing release tag $tag_name conflicts with the validated merged HEAD or annotation." >&2
              exit 1
            fi
            echo "Existing annotated tag $tag_name matches the validated merged HEAD and annotation; adopting it."
          fi
          for manifest in \
            packages/d2bd/Cargo.toml \
            packages/d2b/Cargo.toml \
            packages/d2b-wayland-proxy/Cargo.toml \
            packages/d2b-unsafe-local-helper/Cargo.toml \
            packages/d2b-host/Cargo.toml \
            packages/d2b-priv-broker/Cargo.toml
          do
            package_version=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest" | head -1)
            [ "$package_version" = "$VERSION" ] || {
              echo "Publication blocked: $manifest is not version $VERSION." >&2
              exit 1
            }
          done
          grep -Eq "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          flake_versions=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' flake.nix | sort -u)
          [ "$(printf '%s\n' "$flake_versions" | awk -v expected="$VERSION" '$0 != expected && NF { count++ } END { print count + 0 }')" -eq 0 ]

          expected_keys='["d2b","d2b-activation-helper","d2b-priv-broker","d2b-unsafe-local-helper","d2b-wayland-proxy","d2bd"]'
          manifest_version=$(jq -r 'if .version == null then "null" else (.version | strings) end' nix/prebuilt.json)
          if [ "$manifest_version" = "null" ]; then
            jq -e '.version == null and .system == "x86_64-linux" and .binaries == {}' nix/prebuilt.json >/dev/null
          else
            [ "$manifest_version" = "$VERSION" ]
            [ "$(jq -c '.binaries | keys' nix/prebuilt.json)" = "$expected_keys" ]
          fi

          expected_count=6
          actual_count=$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print | awk 'NF { count++ } END { print count + 0 }')
          [ "$actual_count" -eq "$expected_count" ] || {
            echo "Publication blocked: artifact count is not six." >&2
            exit 1
          }
          (cd dist && sha256sum --check --strict SHA256SUMS)
          for binary in \
            d2b \
            d2b-activation-helper \
            d2b-priv-broker \
            d2b-unsafe-local-helper \
            d2b-wayland-proxy \
            d2bd
          do
            asset="dist/${binary}-${VERSION}-x86_64-linux.tar.gz"
            [ -f "$asset" ] || {
              echo "Publication blocked: missing artifact $asset." >&2
              exit 1
            }
            [ "$(tar -tzf "$asset" | sed '/^$/d')" = "$binary" ] || {
              echo "Publication blocked: artifact $asset contains the wrong binary." >&2
              exit 1
            }
            if [ "$manifest_version" != "null" ]; then
              actual_sri=$(nix hash file --type sha256 --sri "$asset")
              expected_sri=$(jq -er --arg binary "$binary" '.binaries[$binary].hash | strings' nix/prebuilt.json)
              [ "$actual_sri" = "$expected_sri" ] || {
                echo "Publication blocked: manifest hash and artifact hash differ for $binary." >&2
                exit 1
              }
            fi
          done
      - name: Extract release notes
        env:
          VERSION: ${{ needs.prepublication-identity.outputs.version }}
        run: |
          # shellcheck shell=bash
          # shellcheck disable=SC3011,SC3030,SC3040,SC3054
          set -euo pipefail
          perl -0ne '
            my $version = $ENV{VERSION};
            if (/^## \[\Q$version\E\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\n(.*?)(?=^## |\z)/ms) {
              my $section = $1;
              $section =~ s/\A\s+//;
              $section =~ s/\s+\z/\n/;
              print $section;
              exit 0;
            }
            die "missing changelog section for $version\n";
          ' CHANGELOG.md > release-notes.md
      - name: Create or adopt annotated tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepublication-identity.outputs.version }}
          MERGED_V3_HEAD: ${{ needs.prepublication-identity.outputs.merged_v3_head }}
        run: |
          bash -s <<'RELEASE_TAG_SCRIPT'
          # shellcheck shell=bash
          # shellcheck disable=SC3011,SC3030,SC3040,SC3043,SC3054
          set -euo pipefail
          [ -n "$GITHUB_TOKEN" ] || {
            echo "Publication blocked: the contents:write job token is unavailable for tag push." >&2
            exit 1
          }
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: bearer $GITHUB_TOKEN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag_name="v$VERSION"
          tag_ref="refs/tags/$tag_name"

          validate_tag() {
            local tag_kind tag_target tag_header tag_subject
            tag_kind=$(git cat-file -t "$tag_ref" 2>/dev/null || true)
            tag_target=$(git rev-parse "$tag_ref^{commit}" 2>/dev/null || true)
            tag_header=$(git cat-file tag "$tag_ref" 2>/dev/null | sed -n 's/^tag //p' | head -1 || true)
            tag_subject=$(git for-each-ref --format='%(subject)' "$tag_ref" 2>/dev/null || true)
            if [ "$tag_kind" != "tag" ] \
              || [ "$tag_target" != "$MERGED_V3_HEAD" ] \
              || [ "$tag_header" != "$tag_name" ] \
              || [ "$tag_subject" != "$tag_name" ]; then
              echo "Publication blocked: existing release tag $tag_name conflicts with the validated merged HEAD or annotation." >&2
              return 1
            fi
          }

          if git ls-remote --exit-code --refs origin "$tag_ref" >/dev/null 2>&1; then
            git fetch origin "+$tag_ref:$tag_ref"
            validate_tag
            echo "Existing annotated tag $tag_name matches the validated merged HEAD and annotation; adopting it."
          else
            git tag -a "$tag_name" "$MERGED_V3_HEAD" -m "$tag_name"
            if ! git push origin "$tag_name"; then
              echo "Tag push did not report success; checking the remote tag before failing." >&2
              if ! git fetch origin "+$tag_ref:$tag_ref"; then
                echo "Publication blocked: tag push failed and the remote tag is unavailable." >&2
                exit 1
              fi
              validate_tag
              echo "Remote tag $tag_name matches after the interrupted push; adopting it."
            fi
          fi
          RELEASE_TAG_SCRIPT
      - name: Create or complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepublication-identity.outputs.version }}
          MERGED_V3_HEAD: ${{ needs.prepublication-identity.outputs.merged_v3_head }}
        run: |
          bash -s <<'RELEASE_SCRIPT'
          # shellcheck shell=bash
          # shellcheck disable=SC3001,SC3011,SC3024,SC3030,SC3040,SC3043,SC3053,SC3054,SC3055
          set -euo pipefail
          tag_name="v$VERSION"
          release_endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$tag_name"
          release_json=$(mktemp)
          release_response=$(mktemp)
          release_body_file=$(mktemp)
          asset_download_dir=$(mktemp -d)

          cleanup_release_temp() {
            rm -f "$release_json" "$release_response" "$release_body_file"
            rm -rf "$asset_download_dir"
          }
          trap cleanup_release_temp EXIT

          asset_names=(
            "d2b-${VERSION}-x86_64-linux.tar.gz"
            "d2b-activation-helper-${VERSION}-x86_64-linux.tar.gz"
            "d2b-priv-broker-${VERSION}-x86_64-linux.tar.gz"
            "d2b-unsafe-local-helper-${VERSION}-x86_64-linux.tar.gz"
            "d2b-wayland-proxy-${VERSION}-x86_64-linux.tar.gz"
            "d2bd-${VERSION}-x86_64-linux.tar.gz"
            "SHA256SUMS"
          )
          asset_paths=()
          for asset_name in "${asset_names[@]}"; do
            asset_paths+=("dist/$asset_name")
          done
          release_draft_state=""

          read_release() {
            local gh_status http_status
            : > "$release_response"
            gh_status=0
            gh api --include "$release_endpoint" > "$release_response" || gh_status=$?
            http_status=$(awk 'NR == 1 { print $2; exit }' "$release_response")
            case "$http_status" in
              200)
                [ "$gh_status" -eq 0 ] || {
                  echo "Publication blocked: GitHub release lookup returned an inconsistent success response." >&2
                  exit 1
                }
                awk '
                  BEGIN { body = 0 }
                  {
                    sub(/\r$/, "")
                    if (!body && $0 == "") {
                      body = 1
                      next
                    }
                    if (body) print
                  }
                ' "$release_response" > "$release_json"
                jq -e 'type == "object"' "$release_json" >/dev/null || {
                  echo "Publication blocked: GitHub release lookup did not return an object." >&2
                  exit 1
                }
                release_exists=1
                ;;
              404)
                release_exists=0
                ;;
              *)
                echo "Publication blocked: GitHub release lookup returned HTTP ${http_status:-unknown}." >&2
                exit 1
                ;;
            esac
          }

          reject_release_conflict() {
            echo "Publication blocked: existing GitHub release conflicts with the validated release identity." >&2
            exit 1
          }

          validate_release_metadata() {
            local release_tag release_target release_name release_prerelease release_draft
            release_tag=$(jq -er '.tag_name | strings' "$release_json") || reject_release_conflict
            release_target=$(jq -er '.target_commitish | strings' "$release_json" | tr '[:upper:]' '[:lower:]') \
              || reject_release_conflict
            release_name=$(jq -er '.name | strings' "$release_json") || reject_release_conflict
            release_prerelease=$(
              jq -er 'if (.prerelease | type) == "boolean" then (.prerelease | tostring) else error("not a boolean") end' \
                "$release_json"
            ) || reject_release_conflict
            release_draft=$(
              jq -er 'if (.draft | type) == "boolean" then (.draft | tostring) else error("not a boolean") end' \
                "$release_json"
            ) || reject_release_conflict
            [ "$release_tag" = "$tag_name" ] || reject_release_conflict
            [ "$release_target" = "$MERGED_V3_HEAD" ] || reject_release_conflict
            [ "$release_name" = "$tag_name" ] || reject_release_conflict
            [ "$release_prerelease" = "false" ] || reject_release_conflict
            case "$release_draft" in
              true|false) ;;
              *) reject_release_conflict ;;
            esac
            if ! jq -e -j \
              'if (.body | type) == "string" then .body else error("body is not a string") end' \
              "$release_json" > "$release_body_file"; then
              reject_release_conflict
            fi
            cmp -s "$release_body_file" release-notes.md || reject_release_conflict
            release_draft_state="$release_draft"
          }

          asset_is_expected() {
            case "$1" in
              "d2b-${VERSION}-x86_64-linux.tar.gz" \
                | "d2b-activation-helper-${VERSION}-x86_64-linux.tar.gz" \
                | "d2b-priv-broker-${VERSION}-x86_64-linux.tar.gz" \
                | "d2b-unsafe-local-helper-${VERSION}-x86_64-linux.tar.gz" \
                | "d2b-wayland-proxy-${VERSION}-x86_64-linux.tar.gz" \
                | "d2bd-${VERSION}-x86_64-linux.tar.gz" \
                | SHA256SUMS)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          validate_release_assets() {
            local asset_name asset_path expected_size expected_digest matching_assets matching_count
            local remote_state remote_size remote_digest remote_digest_state
            local remote_asset_url remote_asset_id remote_download remote_download_digest
            missing_assets=()
            while IFS= read -r asset_name; do
              if ! asset_is_expected "$asset_name"; then
                echo "Publication blocked: existing GitHub release has unexpected asset $asset_name." >&2
                exit 1
              fi
            done < <(jq -r '.assets[]?.name // empty' "$release_json")

            for index in "${!asset_names[@]}"; do
              asset_name=${asset_names[$index]}
              asset_path=${asset_paths[$index]}
              expected_size=$(wc -c < "$asset_path" | tr -d '[:space:]')
              expected_digest=$(sha256sum "$asset_path" | awk '{print $1}')
              matching_assets=$(jq -c --arg name "$asset_name" \
                '[.assets[]? | select(.name == $name)]' "$release_json")
              matching_count=$(jq -r 'length' <<<"$matching_assets")
              case "$matching_count" in
                0)
                  missing_assets+=("$asset_path")
                  ;;
                1)
                  remote_state=$(jq -r '.[0].state // empty' <<<"$matching_assets")
                  remote_size=$(jq -r '.[0].size // -1' <<<"$matching_assets")
                  [ "$remote_state" = "uploaded" ] || {
                    echo "Publication blocked: existing GitHub release asset $asset_name is not uploaded." >&2
                    exit 1
                  }
                  [ "$remote_size" = "$expected_size" ] || {
                    echo "Publication blocked: existing GitHub release asset $asset_name has a conflicting size." >&2
                    exit 1
                  }
                  remote_digest_state=$(jq -r \
                    '.[0] | if has("digest") and .digest != null then "present" else "absent" end' \
                    <<<"$matching_assets")
                  if [ "$remote_digest_state" = "present" ]; then
                    if ! remote_digest=$(jq -er \
                      '.[0].digest | select(type == "string" and length > 0)' \
                      <<<"$matching_assets"); then
                      echo "Publication blocked: existing GitHub release asset $asset_name has an invalid digest." >&2
                      exit 1
                    fi
                    remote_digest=$(printf '%s' "$remote_digest" | tr '[:upper:]' '[:lower:]')
                    printf '%s' "$remote_digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
                      echo "Publication blocked: existing GitHub release asset $asset_name has an invalid digest." >&2
                      exit 1
                    }
                    [ "$remote_digest" = "sha256:$expected_digest" ] || {
                      echo "Publication blocked: existing GitHub release asset $asset_name has a conflicting digest." >&2
                      exit 1
                    }
                  else
                    if ! remote_asset_url=$(jq -er \
                      '.[0].url | select(type == "string" and length > 0)' \
                      <<<"$matching_assets"); then
                      echo "Publication blocked: existing GitHub release asset $asset_name has no provable bytes." >&2
                      exit 1
                    fi
                    case "$remote_asset_url" in
                      */repos/"$GITHUB_REPOSITORY"/releases/assets/*) ;;
                      *)
                        echo "Publication blocked: existing GitHub release asset $asset_name has no provable bytes." >&2
                        exit 1
                        ;;
                    esac
                    remote_asset_id=${remote_asset_url##*/}
                    printf '%s' "$remote_asset_id" | grep -Eq '^[1-9][0-9]*$' || {
                      echo "Publication blocked: existing GitHub release asset $asset_name has no provable bytes." >&2
                      exit 1
                    }
                    remote_download="$asset_download_dir/$asset_name"
                    if ! gh api \
                      --header 'Accept: application/octet-stream' \
                      "repos/$GITHUB_REPOSITORY/releases/assets/$remote_asset_id" \
                      > "$remote_download"; then
                      echo "Publication blocked: existing GitHub release asset $asset_name could not be downloaded for verification." >&2
                      exit 1
                    fi
                    [ -f "$remote_download" ] || {
                      echo "Publication blocked: existing GitHub release asset $asset_name could not be downloaded for verification." >&2
                      exit 1
                    }
                    remote_download_digest=$(sha256sum "$remote_download" | awk '{print $1}')
                    [ "$remote_download_digest" = "$expected_digest" ] || {
                      echo "Publication blocked: existing GitHub release asset $asset_name has conflicting bytes." >&2
                      exit 1
                    }
                    rm -f "$remote_download"
                  fi
                  ;;
                *)
                  echo "Publication blocked: existing GitHub release has duplicate asset identity for $asset_name." >&2
                  exit 1
                  ;;
              esac
            done
          }

          read_release
          if [ "$release_exists" -eq 0 ]; then
            if ! gh release create "$tag_name" \
              "${asset_paths[@]}" \
              --title "$tag_name" \
              --notes-file release-notes.md \
              --target "$MERGED_V3_HEAD" \
              --verify-tag; then
              echo "Release creation did not report success; checking for a partially created release." >&2
              read_release
              [ "$release_exists" -eq 1 ] || {
                echo "Publication blocked: release creation failed and no GitHub release exists." >&2
                exit 1
              }
            fi
          fi

          read_release
          [ "$release_exists" -eq 1 ] || {
            echo "Publication blocked: GitHub release is unavailable after tag publication." >&2
            exit 1
          }
          validate_release_metadata
          validate_release_assets
          if [ "${#missing_assets[@]}" -gt 0 ]; then
            gh release upload "$tag_name" "${missing_assets[@]}"
          fi

          read_release
          validate_release_metadata
          validate_release_assets
          if [ "$release_draft_state" = "true" ]; then
            gh release edit "$tag_name" --draft=false --verify-tag
          fi

          read_release
          validate_release_metadata
          [ "$release_draft_state" = "false" ] || {
            echo "Publication blocked: GitHub release remains a draft after completion." >&2
            exit 1
          }
          validate_release_assets
          [ "${#missing_assets[@]}" -eq 0 ] || {
            echo "Publication blocked: GitHub release is missing an expected asset after completion." >&2
            exit 1
          }
          echo "GitHub release $tag_name matches the validated identity and has all expected assets."
          RELEASE_SCRIPT
