[package]
name = "d2b-chrome-proxy"
version = "0.0.0-prototype"
edition = "2024"
publish = false
description = "Prototype Wayland proxy carrying the window identity tab (ADR 0047)"

# Standalone by design. This is a COPY of packages/d2b-wayland-proxy carrying
# prototype changes, so the shipping crate stays untouched while the design is
# explored. Nothing here reaches production without an ADR; the integration
# plan is the ADR's job.
#
# The d2b crates below are referenced by path rather than vendored, so the
# prototype cannot drift from the types it will eventually integrate with.
# They are read-only dependencies: this lab never modifies them.
[workspace]

[[bin]]
name = "d2b-chrome-proxy"
path = "src/main.rs"

[lib]
name = "d2b_wayland_proxy"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
d2b-chrome-engine = { path = "../chrome-engine" }
d2b-core = { path = "../../../packages/d2b-core" }
d2b-realm-core = { path = "../../../packages/d2b-realm-core" }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
getrandom = "0.2"
nix = { version = "0.29", default-features = false, features = ["fs", "socket", "uio"] }
rustix = { version = "0.38", features = ["event", "fs", "process", "net", "pipe", "system", "mount", "thread", "pty", "termios", "stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = "1"
thiserror = "2"
uapi = "0.2"
wl-proxy = { version = "=0.1.2", git = "https://github.com/vicondoa/wl-proxy.git", rev = "072945b59fef21a2a8166460454280d543f48772", package = "wl-proxy", features = [
    "protocol-drm",
    "protocol-stream",
    "protocol-wl_eglstream_controller",
    "suite-wayland-protocols",
    "suite-wlr-protocols",
] }
