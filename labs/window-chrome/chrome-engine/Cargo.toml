[package]
name = "d2b-chrome-engine"
version = "0.0.0-prototype"
edition = "2024"
publish = false
description = "Prototype rendering engine for d2b window identity chrome"

# Deliberately NOT a member of the packages/ workspace. This is prototype-only
# code for ADR 0047 exploration; keeping it out of the workspace keeps the
# top-level Rust, deny, and audit gates unaffected by prototype dependencies.
[workspace]

[dependencies]
fontdue = "0.9"
png = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "opentype-layout", "glyph-names"] }

[lints.rust]
unsafe_code = "forbid"
